<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>دفتر التقييم التحصيلي الذكي — غراس المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --sage:#7A9E7E; --sage-d:#5F8465; --sage-l:#E8F0E9;
  --gold:#C9A84C; --gold-l:#F7EFD8;
  --cream:#FAF8F3; --ink:#22302A; --muted:#7B8A80;
  --line:#E4E0D6; --white:#fff;
  --red:#C0605A; --red-l:#FAE8E6;
  --blue:#5A85A8; --blue-l:#E7EFF5;
  --r:14px; --shadow:0 2px 10px rgba(34,48,42,.06), 0 12px 40px rgba(34,48,42,.06);
  --font:'Tajawal','Geeza Pro','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--cream);color:var(--ink);font-size:15px;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none!important}
/* ===== Shell ===== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,248,243,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px}
.seed{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--sage),var(--sage-d));display:grid;place-items:center;box-shadow:0 4px 12px rgba(122,158,126,.35)}
.seed svg{width:19px;height:19px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:-2px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;background:var(--white);border:1px solid var(--line);font-weight:700;font-size:13.5px;transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--sage);color:var(--sage-d);transform:translateY(-1px)}
.btn.primary{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn.primary:hover{background:var(--sage-d);color:#fff}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:#b8973f;color:#fff}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.4;pointer-events:none}
.wrap{max-width:1600px;margin:0 auto;padding:18px}
/* ===== Meta strip ===== */
.metastrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink);font-weight:800}
.chip.on{background:var(--sage-l);border-color:#cfe0d1;color:var(--sage-d)}
/* ===== Toolbar ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:14px;box-shadow:var(--shadow)}
.search{flex:1;min-width:190px;display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:8px 12px}
.search input{border:none;background:none;outline:none;width:100%;font-size:14px}
.seg{display:flex;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--white);color:var(--sage-d);box-shadow:0 1px 4px rgba(0,0,0,.07)}
/* ===== Table ===== */
.tablecard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0;text-align:center;font-size:13px}
table.grid thead th{position:sticky;top:0;z-index:20;background:var(--sage-l);color:var(--sage-d);font-weight:800;font-size:11.5px;line-height:1.35;padding:9px 5px;vertical-align:middle;border-bottom:1.5px solid #cfe0d1}
table.grid thead th .mx{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}
th.stick,td.stick{position:sticky;z-index:15;background:var(--white)}
th.c-no,td.c-no{inset-inline-start:0;width:40px;min-width:40px;color:var(--muted);font-weight:700}
th.c-name,td.c-name{inset-inline-start:40px;min-width:170px;text-align:start;padding:0 10px;font-weight:700;box-shadow:1px 0 0 var(--line)}
thead th.c-no,thead th.c-name{z-index:25;background:var(--sage-l)}
tbody tr:hover td{background:#FDFCF9}
tbody tr:hover td.stick{background:#FDFCF9}
tbody tr.sel td{background:var(--gold-l)!important}
td.c-name .row-name{display:flex;align-items:center;gap:8px;padding:8px 0}
td.c-name .nm{flex:1;cursor:pointer;border-bottom:1px dashed transparent;padding:2px 0}
td.c-name .nm:hover{border-color:var(--sage)}
.cbx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;cursor:pointer;font-size:11px;color:transparent;transition:.12s}
.cbx.on{background:var(--gold);border-color:var(--gold);color:#fff}
/* score cell */
.cell{position:relative;height:46px;display:flex;align-items:center;justify-content:center;gap:2px}
.cell .val{font-weight:800;font-size:15px;min-width:34px;position:relative;z-index:2;transition:.15s}
.cell .fill{position:absolute;inset:auto 4px 4px 4px;height:3px;border-radius:3px;background:var(--sage);opacity:.28;transform-origin:right;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s}
.cell.warn .val{color:var(--gold)}
.cell.warn .fill{background:var(--gold)}
.cell.bad .val{color:var(--red)}
.cell.bad .fill{background:var(--red)}
.cell .stp{width:24px;height:24px;border-radius:8px;background:var(--cream);border:1px solid var(--line);font-weight:800;font-size:14px;line-height:1;color:var(--muted);opacity:0;transform:scale(.8);transition:.14s;z-index:3}
.cell:hover .stp,.cell.touch .stp{opacity:1;transform:scale(1)}
.cell .stp:hover{background:var(--sage);color:#fff;border-color:var(--sage)}
.cell .stp.minus:hover{background:var(--red);border-color:var(--red)}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.cell.hit .val{animation:pulse .3s ease}
td.sum{background:var(--blue-l);font-weight:800;color:#3E6483}
td.grand{background:var(--red-l);font-weight:800;color:#9E4842}
th.sum{background:#DCE9F2!important;color:#3E6483!important}
th.grand{background:#F6DEDB!important;color:#9E4842!important}
td.rank{font-weight:800;color:var(--gold)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:14px 0 6px}
/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:24px;font-weight:800;margin-top:3px}
.stat.a .v{color:var(--sage-d)} .stat.b .v{color:var(--gold)} .stat.c .v{color:var(--red)}
/* ===== Bulk bar ===== */
.bulkbar{position:fixed;inset-inline:0;bottom:16px;z-index:60;display:flex;justify-content:center;pointer-events:none}
.bulkbar .in{pointer-events:auto;display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border-radius:15px;padding:10px 14px;box-shadow:0 12px 40px rgba(0,0,0,.28);flex-wrap:wrap;max-width:94vw}
.bulkbar b{color:var(--gold)}
.bulkbar select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:7px 10px;color:#fff;font-weight:700;font-size:13px}
.bulkbar input{width:60px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:7px 8px;color:#fff;font-weight:800;font-size:14px;text-align:center}
.bulkbar select option{color:#000}
.bulkbar .bb{background:rgba(255,255,255,.14);border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px;color:#fff}
.bulkbar .bb:hover{background:var(--gold)}
/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(34,48,42,.42);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--cream);border-radius:20px;width:100%;max-width:640px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:840px}
.mhead{position:sticky;top:0;background:var(--cream);padding:18px 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.mhead h2{margin:0;font-size:18px;font-weight:800}
.mhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
.mbody{padding:18px 20px}
.mfoot{position:sticky;bottom:0;background:var(--cream);padding:12px 20px 18px;display:flex;gap:9px;justify-content:flex-start;border-top:1px solid var(--line)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--white);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
/* items editor */
.itemrow{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px}
.itemrow input[type=text]{flex:1;border:none;background:none;outline:none;font-weight:700}
.itemrow input[type=number]{width:66px;border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center;font-weight:800;background:var(--cream)}
.itemrow .grp{font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--sage-l);color:var(--sage-d);cursor:pointer}
.itemrow .grp.p{background:var(--blue-l);color:#3E6483}
.itemrow .del{color:var(--muted);font-size:17px;padding:2px 6px;border-radius:7px}
.itemrow .del:hover{background:var(--red-l);color:var(--red)}
.hand{cursor:grab;color:#C9C4B8}
.total-note{display:flex;justify-content:space-between;font-weight:800;font-size:13px;background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:10px 13px;margin-top:8px}
.total-note.bad{border-color:var(--red);color:var(--red)}
/* reasons */
.reasons{display:flex;flex-wrap:wrap;gap:7px}
.reasons button{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;text-align:start}
.reasons button:hover{border-color:var(--red);background:var(--red-l);color:var(--red)}
.logline{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.logline .dt{font-size:11px;color:var(--muted);white-space:nowrap}
.logline .amt{font-weight:800;color:var(--red);min-width:38px}
.logline .amt.up{color:var(--sage-d)}
/* dashboard cards */
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:.16s;position:relative;box-shadow:var(--shadow)}
.rcard:hover{transform:translateY(-2px);border-color:var(--sage)}
.rcard h4{margin:0 0 4px;font-size:15.5px;font-weight:800}
.rcard p{margin:0;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.7}
.rcard .bar{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--sage),var(--gold));margin-bottom:11px;width:44px}
.rcard .x{position:absolute;inset-inline-end:8px;top:8px;color:#CFCABE;padding:4px 7px;border-radius:8px}
.rcard .x:hover{background:var(--red-l);color:var(--red)}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.drop{border:2px dashed var(--line);border-radius:15px;padding:26px;text-align:center;background:var(--white);transition:.15s}
.drop:hover{border-color:var(--sage);background:var(--sage-l)}
.drop .ic{font-size:30px}
.spin{width:17px;height:17px;border:2.5px solid var(--sage-l);border-top-color:var(--sage);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.namechips{display:flex;flex-wrap:wrap;gap:6px;max-height:230px;overflow:auto}
.namechips .nc{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.namechips .nc b{color:var(--muted);font-weight:700;font-size:11px}
.namechips .nc span{cursor:pointer;color:#CFCABE}
.namechips .nc span:hover{color:var(--red)}
/* ===== PRINT ===== */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  .noprint{display:none!important}
  #printArea{display:block}
  .psheet{page-break-after:always;font-family:var(--font)}
  .psheet:last-child{page-break-after:auto}
}
.psheet{padding:6px;direction:rtl}
.phead{display:flex;justify-content:space-between;align-items:flex-start;font-size:10px;font-weight:700;line-height:1.6}
.phead .r{text-align:end}
.ptitle{border:2px solid #000;border-radius:6px;padding:7px 12px;text-align:center;font-weight:800;font-size:14px;margin:8px 0 10px}
table.pt{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed;direction:ltr}
table.pt th,table.pt td{border:1px solid #000;padding:3px 2px;text-align:center;height:20px;font-weight:700}
table.pt th{font-size:8.5px;line-height:1.2}
.h-item{background:#F6C08A} .h-name{background:#C6E0B4} .h-sum{background:#BDD7EE} .h-grand{background:#F8CBCB}
td.p-item{background:#FFFBE8} td.p-name{background:#E9F2E1;text-align:right;padding-right:5px;font-size:10.5px;direction:rtl} td.p-sum{background:#EAF2F8} td.p-grand{background:#FCEDEC}
tr.maxrow td{background:#F6C08A;font-weight:800}
tr.maxrow td.p-sum{background:#F6C08A} tr.maxrow td.p-grand{background:#F6C08A}
.psign{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;font-weight:700}
.psign div{border-top:1px solid #000;padding-top:4px;width:180px;text-align:center}
@media(max-width:760px){
  .wrap{padding:12px}
  .topbar-in{padding:9px 12px;gap:8px}
  .brand small{display:none}
  .btn{padding:8px 11px;font-size:12.5px}
  .tablecard{max-height:calc(100vh - 300px)}
  th.c-name,td.c-name{min-width:130px}
  .g2,.g3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="topbar noprint">
  <div class="topbar-in">
    <div class="brand">
      <div class="seed"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21c0-6 3-9 8-10-1 6-3.5 9-8 10z" fill="#fff" opacity=".95"/><path d="M12 21c0-5-2.5-7.5-7-8.5.8 5 3 7.7 7 8.5z" fill="#fff" opacity=".6"/><path d="M12 21v-6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div>غراس المعلم<small>دفتر التقييم التحصيلي الذكي</small></div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="navHome">🗂 السجلات</button>
    <button class="btn ghost" id="btnItems">⚙️ بنود التقييم</button>
    <button class="btn ghost" id="btnStudents">👥 الطالبات</button>
    <button class="btn" id="btnExcel">⬇️ Excel</button>
    <button class="btn" id="btnPdf">📥 PDF</button>
    <button class="btn gold" id="btnPrint">🖨️ طباعة</button>
  </div>
</div>
<!-- ===== DASHBOARD ===== -->
<div class="wrap noprint hidden" id="viewHome">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div>
      <h1 style="margin:0;font-size:22px">سجلاتي</h1>
      <p style="margin:4px 0 0;color:var(--muted);font-size:13.5px;font-weight:600">كل سجل = مادة × صف × فصل × فترة. يُحفظ تلقائياً.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnKey">🔑 تفعيل الذكاء الاصطناعي</button>
    <button class="btn" id="btnBackup">💾 نسخة احتياطية</button>
    <label class="btn" style="cursor:pointer">↺ استعادة<input type="file" id="btnRestore" accept=".json" style="display:none"></label>
    <button class="btn primary" id="btnNewRec">＋ سجل جديد</button>
  </div>
  <div class="chip" style="margin-bottom:14px">حالة الحفظ: <b id="saveDot">✓ محفوظ</b> · مكان التخزين: <b id="storeDot">—</b></div>
  <div class="stats" id="homeStats"></div>
  <div style="height:16px"></div>
  <div class="records" id="recordList"></div>
</div>
<!-- ===== SHEET ===== -->
<div class="wrap noprint hidden" id="viewSheet">
  <div class="metastrip" id="metaStrip"></div>
  <div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" placeholder="ابحثي باسم الطالبة أو رقمها…"></div>
    <div class="seg" id="filterSeg"></div>
    <button class="btn" id="btnArabicNum">١٢٣</button>
    <button class="btn" id="btnUndo">↩︎ تراجع</button>
  </div>
  <div class="tablecard"><div id="gridHolder"></div></div>
  <div class="stats" id="sheetStats"></div>
  <div style="height:70px"></div>
</div>
<div id="bulkHolder"></div>
<div id="modalHolder"></div>
<div id="toastHolder"></div>
<div id="printArea"></div>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const AR='٠١٢٣٤٥٦٧٨٩';
let arabicNum=true;
const toAr=s=>String(s).replace(/[0-9]/g,d=>AR[+d]);
function fmt(n){
  n=Math.round(n*2)/2;
  const w=Math.floor(n), h=(n-w)>=.5;
  let s=String(w)+(h?'.5':'');
  return arabicNum? toAr(s).replace('.','٫') : s;
}
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const h=$('#toastHolder');h.innerHTML=`<div class="toast">${m}</div>`;clearTimeout(h._t);h._t=setTimeout(()=>h.innerHTML='',2200);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* ================= presets (نموذج وزارة التربية) ================= */
const PRESETS={
  'blank':{label:'بدء فارغ — أكتب البنود بنفسي',items:[],papers:[]},
  'islamic_p2':{label:'التربية الإسلامية — التقييم التحصيلي للفترة الثانية (ابتدائي)',items:[
    ['التزام وسلوك',4],['تفاعل وفهم',12],['الواجبات',10],['حل الأنشطة الصفية',10],
    ['قراءة النصوص الشرعية والتطبيقات العملية',10],['المشروع',4],['تسميع الأحاديث المقررة حفظاً',10]
  ],papers:[['ورقة التقييم 1',10],['ورقة التقييم 2',10],['ورقة التقييم 3',10],['ورقة التقييم 4',10]]},
  'general':{label:'نموذج عام (لغة عربية / رياضيات / علوم)',items:[
    ['التزام وسلوك',4],['تفاعل وفهم',12],['الواجبات',10],['حل الأنشطة الصفية',14],['المشروع',10],['قواعد الأمن والسلامة',10]
  ],papers:[['ورقة التقييم 1',10],['ورقة التقييم 2',10],['ورقة التقييم 3',10],['ورقة التقييم 4',10]]}
};
const REASONS=['لم تحل الواجب','الواجب غير مكتمل','لم تشارك','عدم إحضار الكتاب','عدم الالتزام بالتعليمات','ضعف في التلاوة','ضعف في الحفظ','المشروع غير مكتمل','تأخر عن التسليم','أخرى'];
/* ================= state ================= */
let DB={records:[],current:null};
const KEY='ghiras:gradebook:v1';
// حدّ السجلات لكل اشتراك: سجلان افتراضياً. يمكن للمنصة منح المزيد عبر الرابط ?slots=N
const MAX_RECORDS=(()=>{try{const n=parseInt(new URLSearchParams(location.search).get('slots'),10);return (n&&n>0)?n:2;}catch(e){return 2;}})();
function atLimit(){return DB.records.length>=MAX_RECORDS;}
function limitModal(){
  openModal('وصلتِ للحد المسموح','اشتراكك في دفتر التقييم يتيح إنشاء '+toAr(MAX_RECORDS)+' سجلات',
  `<p style="font-size:14px;line-height:2;margin:0;color:var(--ink)">
   عندك حالياً <b>${toAr(DB.records.length)}</b> من <b>${toAr(MAX_RECORDS)}</b> سجلات، وهذا هو الحد المتاح في اشتراكك 🌿<br><br>
   تقدرين تحذفين سجلاً قديماً لإفساح مكان لسجل جديد،<br>
   أو تشترين اشتراكاً إضافياً للحصول على سجلات أكثر.</p>`);
}
function newRecord(meta,presetKey){
  const p=PRESETS[presetKey]||PRESETS.islamic_p2;
  const items=[...p.items.map(([n,m])=>({id:uid(),name:n,max:m,group:'period'})),
               ...p.papers.map(([n,m])=>({id:uid(),name:n,max:m,group:'papers'}))];
  return {id:uid(),meta,items,students:[],log:[],updated:Date.now()};
}
const rec=()=>DB.records.find(r=>r.id===DB.current);
const periodItems=r=>r.items.filter(i=>i.group==='period');
const paperItems=r=>r.items.filter(i=>i.group==='papers');
const maxOf=(r,g)=>r.items.filter(i=>i.group===g).reduce((a,b)=>a+ +b.max,0);
function score(st,it){return st.scores[it.id]===undefined? +it.max : st.scores[it.id];}
function sumG(r,st,g){return r.items.filter(i=>i.group===g).reduce((a,i)=>a+score(st,i),0);}
function grand(r,st){return sumG(r,st,'period')+sumG(r,st,'papers');}
/* ================= storage =================
   طبقة حفظ مزدوجة: تعمل داخل منصة غراس، وتعمل كذلك عند فتح الملف
   مباشرة على جهاز المعلمة (يُحفظ في ذاكرة المتصفح ولا يُفقد عند الإغلاق). */
let saveT=null, storeMode='—';
async function writeStore(v){
  let ok=false;
  try{ if(window.storage&&window.storage.set){ await window.storage.set(KEY,v); ok=true; storeMode='سحابي'; } }catch(e){}
  try{ window.localStorage.setItem(KEY,v); ok=true; if(storeMode==='—') storeMode='محلي على الجهاز'; }catch(e){}
  return ok;
}
async function readStore(){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(KEY); if(r&&r.value){storeMode='سحابي';return r.value;} } }catch(e){}
  try{ const v=window.localStorage.getItem(KEY); if(v){storeMode='محلي على الجهاز';return v;} }catch(e){}
  return null;
}
function save(){
  const r=rec(); if(r) r.updated=Date.now();
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const ok=await writeStore(JSON.stringify(DB));
    const el=$('#saveDot'); if(el) el.textContent=ok?'✓ محفوظ':'⚠︎ نزّلي نسخة احتياطية';
  },350);
}
async function load(){
  const v=await readStore();
  if(v){ try{ DB=JSON.parse(v); }catch(e){} }
  if(!DB.records) DB={records:[],current:null};
}
function backup(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));
  a.download=`نسخة-احتياطية-غراس-${new Date().toISOString().slice(0,10)}.ghiras.json`; a.click();
  toast('تم تنزيل النسخة الاحتياطية');
}
function restore(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result);
      if(!d.records) throw 0;
      DB=d; save(); renderHome(); toast('تمت استعادة البيانات');
    }catch(e){ toast('الملف غير صالح — اختاري ملف .ghiras.json'); } };
  fr.readAsText(file);
}

  h+=`</tr></thead><tbody>`;
  if(!r.items.length){

  }

    cols.filter(c=>c.group==='period').forEach(c=>h+=cell(c));

    cols.filter(c=>c.group==='papers').forEach(c=>h+=cell(c));
    if(showSums) h+=`<td class="sum">${fmt(sumG(r,s,'papers'))}</td><td class="grand">${fmt(grand(r,s))}</td>`;

  });
  h+=`</tbody></table>`;
  $('#gridHolder').innerHTML=h;
  $('#gridHolder').querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.sel;selected.has(id)?selected.delete(id):selected.add(id);renderSheet();});
  $('#gridHolder').querySelectorAll('[data-open-st]').forEach(b=>b.onclick=()=>studentModal(b.dataset.openSt));
  $('#gridHolder').querySelectorAll('.cell').forEach(c=>{

let showStats=true;
function renderStats(r){
  const box=$('#sheetStats'); if(!box) return;
  const toggle=`<div style="grid-column:1/-1;display:flex;justify-content:flex-end;margin-bottom:2px">
    <button class="btn ghost" id="btnStats" style="padding:6px 12px;font-size:12.5px">📊 الإحصائيات: ${showStats?'ظاهرة':'مخفية'}</button></div>`;
  if(!showStats){ box.innerHTML=toggle; wireStats(); return; }
  const g=r.students.map(s=>grand(r,s));
  const avg=g.length? g.reduce((a,b)=>a+b,0)/g.length : 0;
  const full=maxOf(r,'period')+maxOf(r,'papers');
  const cards=[
    ['عدد الطالبات',fmt(r.students.length),''],['الدرجة الكاملة',fmt(full),''],
    ['أعلى درجة',g.length?fmt(Math.max(...g)):'—','a'],['أقل درجة',g.length?fmt(Math.min(...g)):'—','c'],
    ['متوسط الفصل',g.length?fmt(Math.round(avg*2)/2):'—','b'],['إجمالي الخصومات',fmt(r.log.filter(l=>l.delta<0).length),'c']
  ].map(([k,v,c])=>`<div class="stat ${c}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  // توزيع الدرجات: كم طالبة لكل درجة (مرتّبة تنازليًا)
  const dist=new Map(); g.forEach(v=>dist.set(v,(dist.get(v)||0)+1));
  const order=[...dist.keys()].sort((a,b)=>b-a);
  let distHtml='';
  if(g.length){
    distHtml=`<div style="grid-column:1/-1;margin-top:4px">
      <div style="font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:7px">توزيع الدرجات — كم طالبة لكل درجة</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        ${order.map(v=>`<div class="chip on" style="font-weight:800">الدرجة ${fmt(v)}: <b>${fmt(dist.get(v))}</b> طالبة</div>`).join('')}
      </div></div>`;
  }
  box.innerHTML=toggle+cards+distHtml;
  wireStats();
}
function wireStats(){ const b=$('#btnStats'); if(b) b.onclick=()=>{showStats=!showStats;renderStats(rec());}; }

  $('#bulkPlus').onclick=()=>{readState();if(!bulkState.amt){toast('اكتبي عدد الدرجات المراد إضافتها');return;}applyDelta([...selected],bulkState.item,bulkState.amt,'');};

/* ================= score engine ================= */
function applyDelta(ids,iid,delta,reason,cellEl,note){
  const r=rec(), it=r.items.find(i=>i.id===iid); let changed=0;
  ids.forEach(sid=>{
    const st=r.students.find(s=>s.id===sid); if(!st) return;
    const cur=score(st,it); const next=Math.max(0,Math.min(+it.max,cur+delta));
    if(next===cur) return;
    st.scores[it.id]=next; changed++;
    r.log.unshift({id:uid(),ts:Date.now(),sid,iid,delta:next-cur,reason:reason||'',note:note||''});
  });
  if(!changed){toast(delta<0?'وصلت إلى الصفر — لا يمكن الخصم أكثر':'الدرجة كاملة بالفعل');return;}
  save();
  if(cellEl){ // تحديث موضعي سريع
    const st=r.students.find(s=>s.id===ids[0]);
    const v=score(st,it), p=v/it.max;
    cellEl.querySelector('.val').textContent=fmt(v);
    cellEl.querySelector('.fill').style.transform=`scaleX(${p})`;
    cellEl.className=`cell hit ${p===1?'':p>=.5?'warn':'bad'}`;
    setTimeout(()=>renderSheet(),260);
  } else renderSheet();
}
function askReason(ids,iid,cellEl,bulk,amount){
  ids=Array.isArray(ids)?ids:[ids];
  amount=amount||0.5;
  const r=rec(), it=r.items.find(i=>i.id===iid);
  openModal(`سبب الخصم`,`${esc(it.name)} · خصم ${fmt(amount)} · ${bulk?`${fmt(ids.length)} طالبة`:esc(r.students.find(s=>s.id===ids[0]).name)}`,
  `<div class="reasons">${REASONS.map(x=>`<button data-r="${esc(x)}">${esc(x)}</button>`).join('')}</div>
   <div class="field" style="margin-top:14px"><label>ملاحظة اختيارية (الدرس / النشاط)</label><input id="rnote" placeholder="مثال: درس البعث والحشر — نشاط ٢"></div>`,
  [{t:'خصم دون سبب',cls:'ghost',fn:()=>{applyDelta(ids,iid,-amount,'',cellEl,$('#rnote').value);closeModal();}}]);
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{applyDelta(ids,iid,-amount,b.dataset.r,cellEl,$('#rnote').value);closeModal();});
}

/* ================= طبقة الذكاء الاصطناعي =================
   داخل المنصة: يُنادى الخادم بلا مفتاح.
   في الملف المفتوح مباشرة بالمتصفح: يحتاج مفتاحاً يُحفظ على الجهاز فقط. */
const AIKEY='ghiras:aikey';
/* حد رفع الصور لكل معلمة (على هذا الجهاز) */
const SCAN_LIMIT=20, SCANKEY='ghiras:scancount';
function getScanCount(){try{return parseInt(localStorage.getItem(SCANKEY)||'0',10)||0;}catch(e){return 0;}}
function incScanCount(){try{localStorage.setItem(SCANKEY,String(getScanCount()+1));}catch(e){}}
function scanLimitReached(){return getScanCount()>=SCAN_LIMIT;}
function scanLimitMsg(){return `⚠️ استهلكتِ عدد الصور المسموح به (${fmt(SCAN_LIMIT)} صورة). يمكنكِ إدخال الأسماء والبنود يدويًا.`;}
const getKey=()=>{try{return localStorage.getItem(AIKEY)||'';}catch(e){return'';}};
const hasPlatformAI=()=>!!(window.storage&&window.storage.get);
const AI_BRIDGE='https://ghiras-platform.vercel.app/api/gradebook-ai';
function parseAI(data){
  if(data.error) throw {api:(data.error.message||'خطأ في الخدمة')};
  return data.content.filter(c=>c.type==='text').map(c=>c.text).join('\n').replace(/```json|```/g,'').trim();
}
async function aiCall(blocks,prompt){
  const messages=[{role:'user',content:[...blocks,{type:'text',text:prompt}]}];
  // أولاً: الجسر الآمن على المنصة (لا يحتاج مفتاحاً — يعمل لكل المشتركات)
  try{
    const res=await fetch(AI_BRIDGE,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages})});
    if(res.ok) return parseAI(await res.json());
    const d=await res.json().catch(()=>({}));
    if(d&&d.error) throw {api:d.error.message};
    throw {net:true};
  }catch(e){
    if(e&&e.api) throw e;
    // احتياطي: مفتاح شخصي محفوظ على الجهاز (عند فتح الملف مباشرة بدون المنصة)
    const key=getKey();
    if(!key) throw {noKey:true};
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:1500,messages})});
    return parseAI(await res.json());
  }
}
function fileBlock(file,b64){
  return file.type==='application/pdf'
    ? {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}
    : {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}};
}
const b64of=file=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file);});
function aiErrMsg(e){
  if(e&&e.noKey) return 'ميزة الذكاء الاصطناعي تحتاج تفعيلاً: من الصفحة الرئيسية اضغطي «🔑 تفعيل الذكاء الاصطناعي» وأدخلي المفتاح.';
  if(e&&e.api) return 'تعذّر التنفيذ: '+esc(e.api);
  return 'تعذّرت القراءة. جرّبي صورة أوضح، أو أدخلي البيانات يدوياً.';
}

  openModal('تفعيل الذكاء الاصطناعي','مطلوب لقراءة كشوف الأسماء ونماذج التقييم من الصور',

   • لا تضعي مفتاحك داخل النسخة التي تبيعينها — عند نشر الدفتر على منصة غراس يبقى المفتاح على الخادم وتستخدمه المعلمات بلا إدخال أي شيء.<br>
   • بقية مزايا الدفتر تعمل كاملة بدون تفعيل: الرصد، الخصم، الطباعة، PDF، Excel، لصق الأسماء، واستيراد CSV.</p>`,

}
/* ---------- قراءة بنود التقييم من صورة النموذج ---------- */
let scanned=[];
async function scanItems(file,redraw){
  const st=$('#scanStatus');
  if(scanLimitReached()){ st.innerHTML=scanLimitMsg(); return; }
  st.innerHTML='<span class="spin"></span> جارٍ قراءة النموذج…';
  $('#scanReview').innerHTML='';
  try{
    const b64=await b64of(file);
    const prompt=`هذا نموذج تقييم تحصيلي من وزارة التربية. استخرج أعمدة بنود التقييم ودرجة كل بند الكاملة (صف الدرجات العلوي).
قواعد مهمة:
- تجاهل تماماً: رقم الطالب، اسم الطالب/الطالبة، وأعمدة المجموع والمجموع الكلي ومجموع كلي.
- البنود التي اسمها من نوع "ورقة التقييم 1/2/3/4" اجعل group = "papers"، وما عداها group = "period".
- رتّب البنود من اليمين إلى اليسار كما تظهر في الجدول.
أعد النتيجة كمصفوفة JSON فقط بلا أي شرح أو Markdown، بهذا الشكل:
[{"name":"التزام وسلوك","max":4,"group":"period"},{"name":"ورقة التقييم 1","max":10,"group":"papers"}]`;
    const txt=await aiCall([fileBlock(file,b64)],prompt);
    scanned=JSON.parse(txt).filter(x=>x&&x.name&&isFinite(+x.max))
      .map(x=>({name:String(x.name).trim(),max:+x.max,group:x.group==='papers'?'papers':'period'}));
    if(!scanned.length) throw 0;
    incScanCount();
    const tot=scanned.reduce((a,b)=>a+b.max,0);
    st.innerHTML=`✅ قُرئ ${fmt(scanned.length)} بنداً — المجموع الكلي ${fmt(tot)}. راجعيها قبل الاعتماد. (المتبقّي من الصور: ${fmt(Math.max(0,SCAN_LIMIT-getScanCount()))})`;
    drawScan(redraw);
  }catch(e){ st.innerHTML=aiErrMsg(e); }
}
function drawScan(redraw){
  if(!scanned.length){$('#scanReview').innerHTML='';return;}
  $('#scanReview').innerHTML=`<div class="namechips" style="margin-top:8px">
    ${scanned.map((x,i)=>`<div class="nc"><b>${x.group==='papers'?'ورقة':'فترة'}</b>${esc(x.name)} · ${fmt(x.max)}<span data-sc="${i}">✕</span></div>`).join('')}
    </div><button class="btn primary" id="applyScan" style="margin-top:10px">اعتماد هذه البنود</button>`;
  $('#scanReview').querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scanned.splice(+b.dataset.sc,1);drawScan(redraw);});
  $('#applyScan').onclick=()=>applyScan(redraw);
}
function applyScan(redraw){
  const r=rec();
  if(r.items.length&&!confirm('سيُستبدل جدول البنود الحالي وتُمسح جميع الدرجات المرصودة. هل تريدين المتابعة؟')) return;
  r.items=scanned.map(x=>({id:uid(),name:x.name,max:x.max,group:x.group}));
  r.students.forEach(s=>s.scores={});
  scanned=[];save();$('#scanReview').innerHTML='';$('#scanStatus').textContent='✅ تم اعتماد البنود';
  redraw();toast('تم إنشاء جدول البنود من الصورة');
}

function undo(logId){

  if(st&&it) st.scores[it.id]=Math.max(0,Math.min(+it.max,score(st,it)-l.delta));

  const maxRow=`<tr class="maxrow"><td class="p-grand">${fmt(maxOf(r,'period')+maxOf(r,'papers'))}</td><td class="p-sum">${fmt(maxOf(r,'papers'))}</td>
    ${pap.map(p=>`<td>${fmt(p.max)}</td>`).reverse().join('')}<td class="p-sum">${fmt(maxOf(r,'period'))}</td>
    ${per.map(p=>`<td>${fmt(p.max)}</td>`).reverse().join('')}<td class="p-name"></td><td></td></tr>`;
  const m=r.meta;
  $('#printArea').innerHTML=chunk.map((grp,ci)=>`<div class="psheet">
    <div class="phead"><div>${esc(m.school||'')}</div><div class="r">وزارة التربية${m.district?'<br>الإدارة العامة لـ'+esc(m.district):''}${m.school?'<br>'+esc(m.school):''}${m.dept?'<br>'+esc(m.dept):''}</div></div>
    <div class="ptitle">${[m.subject?'مادة '+esc(m.subject):'',esc(m.section||''),m.period?'التقييم التحصيلي لـ'+esc(m.period):'',m.year?'للعام الدراسي '+esc(m.year):'',esc(m.mode||'')].filter(Boolean).join(' — ')}</div>
    <table class="pt"><thead>${head}</thead><tbody>${ci===0?maxRow:''}
    ${grp.map((s,i)=>`<tr>
      <td class="p-grand">${fmt(grand(r,s))}</td><td class="p-sum">${fmt(sumG(r,s,'papers'))}</td>
      ${pap.map(p=>`<td class="p-item">${fmt(score(s,p))}</td>`).reverse().join('')}
      <td class="p-sum">${fmt(sumG(r,s,'period'))}</td>
      ${per.map(p=>`<td class="p-item">${fmt(score(s,p))}</td>`).reverse().join('')}
      <td class="p-name">${esc(s.name)}</td><td>${fmt(ci*15+i+1)}</td></tr>`).join('')}
    </tbody></table>
    <div class="psign"><div>معلمة المادة: ${esc(m.teacher||'')}</div><div>رئيسة القسم: ${esc(m.deptHead||'')}</div><div>مديرة المدرسة: ${esc(m.principal||'')}</div></div>
  </div>`).join('');
}
async function exportPDF(){
  const r=rec();
  if(!window.jspdf||!window.html2canvas){toast('تعذّر تحميل مولّد PDF — استخدمي زر الطباعة ثم «حفظ كـ PDF»');return;}
  toast('جارٍ تجهيز ملف PDF…');
  buildPrint();
  const area=$('#printArea');
  area.setAttribute('dir','rtl');
  Object.assign(area.style,{display:'block',position:'fixed',left:'-11000px',top:'0',width:'1123px',background:'#fff',padding:'10px',direction:'rtl'});
  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const sheets=[...area.querySelectorAll('.psheet')];
    for(let i=0;i<sheets.length;i++){
      const canvas=await html2canvas(sheets[i],{scale:2,backgroundColor:'#ffffff',logging:false});
      const w=287, h=Math.min(canvas.height*w/canvas.width,200);
      if(i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',5,5,w,h);
    }
    pdf.save(`تقييم-${r.meta.subject}-${r.meta.section}-${r.meta.period}.pdf`);
    toast('تم تنزيل ملف PDF');
  }catch(e){ toast('تعذّر إنشاء PDF — استخدمي زر الطباعة ثم «حفظ كـ PDF»'); }
  finally{ area.removeAttribute('style'); }
}
function exportExcel(){
  const r=rec(); const per=periodItems(r), pap=paperItems(r);
  const th=(t,bg)=>`<th style="background:${bg};border:1px solid #000;padding:4px;font-family:Tajawal">${t}</th>`;
  let h=`<html dir="rtl"><head><meta charset="utf-8"></head><body><table border="1" style="border-collapse:collapse;text-align:center">
  <tr><td colspan="${r.items.length+4}" style="font-weight:bold;background:#E8F0E9">مادة ${r.meta.subject} — ${r.meta.section} — ${r.meta.period} — ${r.meta.year}</td></tr>
  <tr>${th('م','#EEE')}${th('اسم الطالبة','#C6E0B4')}${per.map(p=>th(p.name,'#F6C08A')).join('')}${th('مجموع','#BDD7EE')}${pap.map(p=>th(p.name,'#F6C08A')).join('')}${th('المجموع الكلي','#BDD7EE')}${th('مجموع كلي','#F8CBCB')}</tr>
  <tr><td></td><td>الدرجة الكاملة</td>${per.map(p=>`<td style="background:#F6C08A">${p.max}</td>`).join('')}<td style="background:#F6C08A">${maxOf(r,'period')}</td>${pap.map(p=>`<td style="background:#F6C08A">${p.max}</td>`).join('')}<td style="background:#F6C08A">${maxOf(r,'papers')}</td><td style="background:#F6C08A">${maxOf(r,'period')+maxOf(r,'papers')}</td></tr>`;
  r.students.forEach((s,i)=>{
    const row=3+i+1; const c=n=>String.fromCharCode(67+n);
    const p1=`=SUM(C${row}:${c(per.length-1)}${row})`;
    h+=`<tr><td>${i+1}</td><td style="background:#E9F2E1;text-align:right">${esc(s.name)}</td>
      ${per.map(p=>`<td style="background:#FFFBE8">${score(s,p)}</td>`).join('')}
      <td style="background:#EAF2F8">${p1}</td>
      ${pap.map(p=>`<td style="background:#FFFBE8">${score(s,p)}</td>`).join('')}
      <td style="background:#EAF2F8">${sumG(r,s,'papers')}</td><td style="background:#FCEDEC;font-weight:bold">${grand(r,s)}</td></tr>`;
  });
  h+=`</table></body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+h],{type:'application/vnd.ms-excel'}));
  a.download=`تقييم-${r.meta.subject}-${r.meta.section}.xls`; a.click();
  toast('تم تنزيل ملف Excel');
}

    w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

      @page{size:A4 landscape;margin:8mm}</style></head><body dir="rtl">${$('#printArea').innerHTML}</body></html>`);

}
