<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدي الدول والعواصم — وقت غراس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{background-color:#081326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;color:#EAF2FF;min-height:100vh;
 background:radial-gradient(1200px 700px at 50% -10%,#123a63 0%,#0b1e38 45%,#081326 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
 background-image:radial-gradient(circle at 20% 30%,#4FC3F7 0 2px,transparent 2px),radial-gradient(circle at 70% 60%,#4FC3F7 0 2px,transparent 2px),radial-gradient(circle at 45% 80%,#FFC93C 0 2px,transparent 2px);
 background-size:180px 180px,240px 240px,300px 300px}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:Cairo;font-weight:900;font-size:clamp(1.7rem,5.2vw,3rem);margin:2px 0 6px;
 background:linear-gradient(180deg,#EAF6FF,#8FD0FF 55%,#4FA8E8);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:Cairo;font-weight:800;letter-spacing:.32em;font-size:.7rem;color:#FFC93C;opacity:.9}
.hero{text-align:center;margin:10px 0 20px}
.hero p{color:#9FB6D4;margin:6px 0 0;font-size:clamp(.9rem,2.4vw,1.05rem)}
.globe{width:clamp(74px,17vw,116px);height:auto;display:block;margin:0 auto 6px}
.panel{background:#0E2440;border:1px solid #1E4670;border-radius:18px;padding:16px;margin-bottom:14px;
 box-shadow:0 14px 34px rgba(0,0,0,.42)}
.panel h3{font-family:Cairo;font-weight:800;font-size:1rem;margin:0 0 12px;color:#7FC7FF}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:11px 17px;border-radius:12px;background:#12304F;border:1px solid #275984;color:#CFE3FA;
 font-family:Cairo;font-weight:700;font-size:.95rem;cursor:pointer;transition:.16s}
.chip:hover{border-color:#4FA8E8}
.chip.on{background:#1D5A94;border-color:#7FC7FF;color:#fff;box-shadow:0 0 0 3px rgba(127,199,255,.18)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:12px}
.names input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #275984;background:#0A1E36;
 color:#EAF2FF;font-family:Tajawal;font-size:.95rem}
.names input:focus{outline:none;border-color:#7FC7FF}
.big-btn{display:block;width:100%;padding:17px;border:0;border-radius:16px;cursor:pointer;
 font-family:Cairo;font-weight:900;font-size:1.2rem;color:#08243F;
 background:linear-gradient(180deg,#FFD86B,#F0B429);box-shadow:0 8px 0 #B8860B,0 16px 30px rgba(240,180,41,.28)}
.big-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #B8860B}
.sc{display:none}.sc.on{display:block}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.turn{font-family:Cairo;font-weight:800;padding:9px 16px;border-radius:12px;font-size:1rem;color:#fff}
.pill{background:#0E2440;border:1px solid #1E4670;border-radius:11px;padding:8px 13px;font-family:Cairo;
 font-weight:700;font-size:.85rem;color:#9FB6D4}
.icobtn{margin-inline-start:auto;background:#0E2440;border:1px solid #1E4670;color:#CFE3FA;border-radius:11px;
 padding:8px 12px;cursor:pointer;font-size:1rem}
.stage{background:#0C2A4A;border:1px solid #1E4670;border-radius:20px;padding:20px 16px;text-align:center;
 box-shadow:0 16px 40px rgba(0,0,0,.42)}
.qtag{display:inline-block;background:#123A63;border:1px solid #2E6796;color:#8FD0FF;font-family:Cairo;
 font-weight:700;font-size:.76rem;padding:6px 13px;border-radius:99px;margin-bottom:12px}
.flag{width:clamp(140px,32vw,210px);height:clamp(140px,32vw,210px);margin:4px auto 10px;display:block;
 border-radius:50%;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.08)}
.flag svg{width:100%;height:100%;display:block;border-radius:50%}
.flagbox{position:relative;width:clamp(140px,32vw,210px);height:clamp(140px,32vw,210px);margin:4px auto 10px}
.flagbox .flag{margin:0}
.tiles{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;
 grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tiles i{background:linear-gradient(160deg,#2E6796,#173E66);border:2px solid #0C2A4A;
 transition:opacity .45s,transform .45s;display:flex;align-items:center;justify-content:center}
.tiles i::after{content:"؟";font-family:Cairo;font-weight:900;font-size:1.5rem;color:#7FC7FF;opacity:.55}
.tiles i.off{opacity:0;transform:scale(.6)}
.qtext{font-family:Cairo;font-weight:800;font-size:clamp(1.1rem,3.4vw,1.55rem);margin:8px 0 4px;line-height:1.5}
.bigword{font-family:Cairo;font-weight:900;font-size:clamp(2rem,8vw,3.6rem);margin:14px 0 6px;color:#FFD86B;
 text-shadow:0 6px 24px rgba(255,201,60,.28)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin-top:16px}
.opt{padding:16px 14px;border-radius:14px;border:1px solid #275984;background:#12304F;color:#EAF2FF;
 font-family:Cairo;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.14s}
.opt:hover:not(:disabled){border-color:#7FC7FF;background:#17406B}
.opt:disabled{cursor:default}
.opt.good{background:#146B4A;border-color:#2ED08C;color:#fff}
.opt.bad{background:#7A2230;border-color:#E85D75;color:#fff}
.clock{font-family:Cairo;font-weight:900;font-size:2rem;color:#FFC93C;margin:6px 0}
.clock.warn{color:#FF7B7B}
.note{color:#9FB6D4;font-size:.92rem;margin-top:10px;min-height:1.2em}
.scores{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;justify-content:center}
.tcard{background:#0E2440;border:1px solid #1E4670;border-radius:14px;padding:10px 14px;min-width:120px;text-align:center}
.tcard.act{border-color:#FFC93C;box-shadow:0 0 0 3px rgba(255,201,60,.16)}
.tcard b{display:block;font-family:Cairo;font-weight:800;font-size:.9rem}
.tcard span{font-family:Cairo;font-weight:900;font-size:1.5rem;color:#FFD86B}
.surprise{background:linear-gradient(180deg,#2A1B52,#160E30);border:1px solid #6B4FD1;border-radius:20px;
 padding:26px 18px;text-align:center;box-shadow:0 16px 44px rgba(107,79,209,.3)}
.surprise .em{font-size:clamp(2.6rem,10vw,4rem);line-height:1.1}
.surprise h2{font-family:Cairo;font-weight:900;font-size:clamp(1.3rem,4.5vw,2rem);margin:8px 0 4px;color:#E3D6FF}
.surprise p{color:#B9A9E8;margin:0 0 16px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0}
.pod{background:#0E2440;border:1px solid #1E4670;border-radius:16px;padding:14px 16px;text-align:center;min-width:130px}
.pod img{width:46px;height:auto;display:block;margin:0 auto 6px}
.pod .pn{display:block;font-family:Cairo;font-weight:800;font-size:.95rem}
.pod .pp{display:block;font-family:Cairo;font-weight:900;font-size:1.7rem;color:#FFD86B}
.endbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.ebtn{padding:14px;border-radius:13px;border:1px solid #275984;background:#12304F;color:#EAF2FF;
 font-family:Cairo;font-weight:700;font-size:1rem;cursor:pointer}
.ebtn:hover{border-color:#7FC7FF}
.ebtn.gold{background:linear-gradient(180deg,#FFD86B,#F0B429);color:#08243F;border:0;font-weight:900}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>
<body>
<a href="/games-info" id="ghiras-back-btn" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;gap:6px;background:rgba(65,96,63,.92);color:#fff;font-family:Tajawal,'Segoe UI',sans-serif;font-weight:800;font-size:13px;line-height:1;padding:9px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)">← ألعاب ومعلومات</a>

<button id="gBack" aria-label="رجوع"><span>‹</span> رجوع</button>
<div id="gAsk"><div class="gbox"><p id="gMsg">إنهاء الجولة والعودة لشاشة الإعداد؟</p>
<div class="grow"><button id="gYes">نعم، ارجع</button><button id="gNo">لا، أكمل</button></div></div></div>

<canvas id="fx"></canvas>
<div class="wrap">

<!-- ========== شاشة الإعداد ========== -->
<section class="sc on" id="setup">
  <div class="hero">
    <div id="globeHolder"></div>
    <div class="eyebrow">WORLD CHALLENGE</div>
    <h1>تحدي الدول والعواصم</h1>
    <p>هل تعرف العالم من أعلامه وعواصمه؟</p>
  </div>

  <div class="panel"><h3>◆ مجموعة الدول</h3><div class="chips" id="mods"></div></div>
  <div class="panel"><h3>◆ عدد الفرق</h3><div class="chips" id="tms"></div><div class="names" id="nms"></div></div>
  <div class="panel"><h3>◆ مستوى الصعوبة</h3><div class="chips" id="dif"></div></div>
  <div class="panel"><h3>◆ مدة اللعب</h3><div class="chips" id="len"></div></div>
  <button class="big-btn" id="start">▶ ابدأ التحدي</button>
</section>

<!-- ========== شاشة اللعب ========== -->
<section class="sc" id="play">
  <div class="topbar">
    <div class="turn" id="turn">دور الفريق</div>
    <div class="pill" id="prog">١ / ١٠</div>
    <div class="pill" id="modName"></div>
    <button class="icobtn" id="mute">🔊</button>
  </div>
  <div id="board"></div>
  <div class="scores" id="scores"></div>
</section>

<!-- ========== الشاشة الختامية ========== -->
<section class="sc" id="end">
  <div class="hero">
    <img class="globe" id="endIco" alt="">
    <div class="eyebrow">FINAL</div>
    <h1>انتهى تحدي الدول والعواصم!</h1>
    <p id="endSub"></p>
  </div>
  <div class="podium" id="podium"></div>
  <div class="endbtns">
    <button class="ebtn gold" id="again">🔄 العب مرة أخرى</button>
    <button class="ebtn" id="othermod">🎲 نموذج آخر</button>
    <button class="ebtn" id="pick">🌍 اختر مجموعة أخرى</button>
  </div>
</section>

</div>

/* ---------- الصوت ---------- */
let muted=false, AC=null;
function ensureAC(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    return AC;
  }catch(e){return null}
}
/* فكّ قفل الصوت عند أول لمسة — سياسات المتصفحات تمنع الصوت قبل تفاعل المستخدم */
function unlock(){
  const a=ensureAC();
  if(a){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();
    s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
  removeEventListener("pointerdown",unlock);removeEventListener("touchstart",unlock);
  removeEventListener("keydown",unlock);removeEventListener("click",unlock);
}
addEventListener("pointerdown",unlock,{once:false});
addEventListener("touchstart",unlock,{once:false});
addEventListener("keydown",unlock,{once:false});
addEventListener("click",unlock,{once:false});

function tone(f,d,type,vol){
  if(muted)return;
  const a=ensureAC(); if(!a)return;
  try{
    const t0=a.currentTime+.005;
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||.18,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}
}

const fx=$("#fx"),ctx=fx.getContext("2d");let parts=[];
function fit(){fx.width=innerWidth;fx.height=innerHeight}fit();addEventListener("resize",fit);
function burst(n,col){
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/2.6,
    vx:(Math.random()-.5)*13,vy:Math.random()*-12-3,g:.36,
    c:col||rnd(["#FFD86B","#3BA9F5","#57D68A","#FF5C8A","#B583FF","#fff"]),
    s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,l:80});
  if(parts.length)requestAnimationFrame(tickFx);
}
function tickFx(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.l-->0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.globalAlpha=Math.max(0,p.l/80);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
  if(parts.length)requestAnimationFrame(tickFx);else ctx.clearRect(0,0,fx.width,fx.height);
}

const S={model:null,teams:1,names:[],scores:[],turn:0,diff:2,rounds:14,

function recent(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function remember(id){try{let r=recent().filter(x=>x!==id);r.unshift(id);localStorage.setItem(STORE,JSON.stringify(r.slice(0,5)))}catch(e){}}

function buildSetup(){
  const m=$("#mods");m.innerHTML="";
  MODELS.forEach(mo=>{
    const b=document.createElement("button");b.className="chip";b.textContent=AR(mo.id)+" · "+mo.title;
    b.onclick=()=>{S.model=mo.id;paintSetup()};m.appendChild(b);
  });
  const dice=document.createElement("button");dice.className="chip";dice.textContent="🎲 اختر لي";
  dice.onclick=()=>{const r=recent();const fresh=MODELS.filter(x=>!r.includes(x.id));
    S.model=rnd((fresh.length?fresh:MODELS)).id;paintSetup()};
  m.appendChild(dice);

  const t=$("#tms");t.innerHTML="";
  [[1,"لاعب واحد"],[2,"فريقان"],[3,"٣ فرق"],[4,"٤ فرق"]].forEach(([n,l])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=l;
    b.onclick=()=>{S.teams=n;paintSetup()};t.appendChild(b);
  });

  const d=$("#dif");d.innerHTML="";
  [[1,"🟢 سهل"],[2,"🟡 متوسط"],[3,"🔴 تحدٍّ"]].forEach(([n,l])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=l;
    b.onclick=()=>{S.diff=n;paintSetup()};d.appendChild(b);
  });

  const L=$("#len");L.innerHTML="";
  [[8,"⚡ سريع"],[14,"🎮 عادي"],[22,"🏆 جولة طويلة"]].forEach(([n,l])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=l;
    b.onclick=()=>{S.rounds=n;paintSetup()};L.appendChild(b);
  });

  $("#globeHolder").innerHTML=`<img class="globe" src="${ICO_GLOBE}" alt="">`;
  $("#endIco").src=ICO_GLOBE;
  S.model=S.model||1;paintSetup();
}
function paintSetup(){
  [...$("#mods").children].forEach((b,i)=>b.classList.toggle("on",MODELS[i]&&MODELS[i].id===S.model));
  [...$("#tms").children].forEach((b,i)=>b.classList.toggle("on",i+1===S.teams));
  [...$("#dif").children].forEach((b,i)=>b.classList.toggle("on",i+1===S.diff));
  [...$("#len").children].forEach((b,i)=>b.classList.toggle("on",[8,14,22][i]===S.rounds));
  const n=$("#nms");n.innerHTML="";
  const def=["الفريق الأول","الفريق الثاني","الفريق الثالث","الفريق الرابع"];
  for(let i=0;i<S.teams;i++){
    const inp=document.createElement("input");
    inp.value=S.names[i]||(S.teams===1?"اللاعب":def[i]);
    inp.oninput=e=>S.names[i]=e.target.value;
    S.names[i]=inp.value;n.appendChild(inp);
  }
}

  const band=S.diff===1?[1]:S.diff===2?[1,2]:[1,2,3];
  let f=pool.filter(c=>band.includes(c.d));
  if(f.length<6)f=pool;                       // ضمان ألا تفرغ المجموعة
  S.pool=f;
  return f.length>=6;
}
function nextCountry(){
  let av=S.pool.filter(c=>!S.used.includes(c.n)&&c.n!==S.lastCountry);
  if(!av.length){S.used=[];av=S.pool.filter(c=>c.n!==S.lastCountry)}
  const c=rnd(av);S.used.push(c.n);S.lastCountry=c.n;return c;
}
function distract(right,key){
  // مشتّتات منطقية: نفس القارة أولًا، ثم أي دولة
  let same=S.pool.filter(c=>c.n!==right.n&&c.k===right.k);
  let other=S.pool.filter(c=>c.n!==right.n&&c.k!==right.k);
  const out=[];
  shuffle(same).forEach(c=>{if(out.length<3&&!out.some(o=>o[key]===c[key]))out.push(c)});
  shuffle(other).forEach(c=>{if(out.length<3&&!out.some(o=>o[key]===c[key]))out.push(c)});
  return out;
}

/* ---------- المؤقّت ---------- */
let clock=null;
function stopClock(){if(clock){clearInterval(clock);clock=null}}

/* ---------- الجولة ---------- */
const TYPES=["flagCountry","countryCapital","capitalCountry","flagCapital","capitalBig","speed","hidden","which"];
function pickType(){
  let t=TYPES.filter(x=>x!==S.lastType);
  if(S.diff===1)t=t.filter(x=>x!=="hidden");
  S.lastType=rnd(t);return S.lastType;
}
const SURPRISES=[
 {k:"double", em:"🌟",t:"ضاعف نقاطك!", p:"السؤال القادم بضعف النقاط"},
 {k:"lightning",em:"⚡",t:"سؤال البرق!", p:"٥ ثوانٍ فقط للإجابة"},
 {k:"golden", em:"💎",t:"الجولة الذهبية!", p:"سؤال أصعب… ونقاطه ×٣"},
 {k:"gift",   em:"🎁",t:"جولة المفاجأة!", p:"سؤال أسهل مع نقاط إضافية"},
];

function turnName(){return S.names[S.turn]||"الفريق"}
function paintTop(){
  const c=TEAM_COLORS[S.turn%4];
  const t=$("#turn");
  t.textContent=S.teams===1?"دورك الآن":"دور "+turnName();
  t.style.background=c;
  $("#prog").textContent=AR(Math.min(S.q+1,S.rounds))+" / "+AR(S.rounds);
  $("#modName").textContent=MODELS.find(x=>x.id===S.model).title;
  const sc=$("#scores");sc.innerHTML="";
  for(let i=0;i<S.teams;i++){
    const d=document.createElement("div");
    d.className="tcard"+(i===S.turn?" act":"");
    d.style.borderColor=i===S.turn?TEAM_COLORS[i%4]:"";
    d.innerHTML=`<b style="color:${TEAM_COLORS[i%4]}">${S.names[i]}</b><span>${AR(S.scores[i])}</span>`;
    sc.appendChild(d);
  }
}

function nextRound(){
  stopClock();S.mult=1;
  if(S.q>=S.rounds){return finish()}
  paintTop();
  // مفاجأة: لا تظهر قبل الجولة ٣، ولا مرتين متقاربتين
  if(S.q>=2 && S.q-S.lastSurprise>=3 && Math.random()<.3){
    S.lastSurprise=S.q;return showSurprise(rnd(SURPRISES));
  }
  askQuestion(null);
}

function showSurprise(s){
  SFX.gold();burst(50,"#B583FF");
  $("#board").innerHTML=`<div class="surprise">
    <div class="em">${s.em}</div><h2>${s.t}</h2><p>${s.p}</p>
    <button class="big-btn" id="go">▶ هيا بنا</button></div>`;
  $("#go").onclick=()=>askQuestion(s.k);
}

function askQuestion(bonus){
  const type = bonus==="lightning" ? "speed" : pickType();
  const c=nextCountry();
  let base=c.d*10;
  if(bonus==="double")base*=2;
  if(bonus==="golden")base*=3;
  if(bonus==="gift")base+=15;
  render(type,c,base,bonus);
}

function optionsHTML(list,key){
  return `<div class="opts">`+list.map((o,i)=>
    `<button class="opt" data-i="${i}">${o[key]}</button>`).join("")+`</div>`;
}

function render(type,c,base,bonus){
  const b=$("#board");
  const tagMap={flagCountry:"🚩 خمّن الدولة من العلم",countryCapital:"🏛️ ما عاصمة هذه الدولة؟",
    capitalCountry:"🗺️ الدولة التي عاصمتها…",flagCapital:"🚩 العلم والعاصمة",
    capitalBig:"✨ العاصمة أولًا",speed:"⚡ تحدي السرعة",hidden:"🧩 العلم المخفي",which:"🤔 دولة أم عاصمة؟"};
  const tag=`<div class="qtag">${tagMap[type]}</div>`;

  /* --- النوع ٨: دولة أم عاصمة؟ --- */
  if(type==="which"){
    const isCap=Math.random()<.5;
    const word=isCap?c.c:c.n;
    b.innerHTML=`<div class="stage">${tag}
      <div class="bigword">«${word}»</div>
      <p class="qtext">هل هذه دولة أم عاصمة؟</p>
      <div class="opts">
        <button class="opt" data-i="0">🌍 دولة</button>
        <button class="opt" data-i="1">🏛️ عاصمة</button></div>
      <div class="note" id="note"></div></div>`;
    return wire(b,isCap?1:0,base,()=>{
      $("#note").textContent = isCap ? `«${c.c}» عاصمة ${c.n}` : `${c.n} عاصمتها ${c.c}`;
    });
  }

  /* --- الأنواع المعتمدة على خيارات --- */
  let key,right,list,head="",qt="";
  if(type==="flagCountry"||type==="speed"||type==="hidden"){
    key="n";right=c;list=shuffle([c,...distract(c,"n")]);
    qt="ما اسم هذه الدولة؟";
  }else if(type==="flagCapital"){
    key="c";right=c;list=shuffle([c,...distract(c,"c")]);
    qt="شاهدوا العلم… وحدّدوا العاصمة";
  }else if(type==="countryCapital"){
    key="c";right=c;list=shuffle([c,...distract(c,"c")]);
    head=`<div class="bigword">${c.n}</div>`;qt=`ما عاصمة ${c.n}؟`;
  }else if(type==="capitalCountry"){
    key="n";right=c;list=shuffle([c,...distract(c,"n")]);
    qt=`ما اسم الدولة التي عاصمتها «${c.c}»؟`;
  }else{ // capitalBig
    key="n";right=c;list=shuffle([c,...distract(c,"n")]);
    head=`<div class="bigword">«${c.c}»</div>`;qt="هذه عاصمة أي دولة؟";
  }
  const idx=list.findIndex(x=>x.n===right.n);

  /* تحدي السرعة: يظهر العلم ثم يختفي */
  if(type==="speed"){
    const secs = bonus==="lightning" ? 5 : 10;
    b.innerHTML=`<div class="stage">${tag}
      ${flagHTML(c)}
      <p class="qtext">انظروا جيدًا… سيختفي العلم!</p>
      <div class="clock" id="ck">${AR(3)}</div></div>`;
    let n=3;
    clock=setInterval(()=>{n--;SFX.tick();
      if(n<=0){stopClock();speedPhase(c,list,idx,base,secs,tag,qt);}
      else $("#ck").textContent=AR(n);},900);
    return;
  }

  /* العلم المخفي */
  if(type==="hidden"){
    b.innerHTML=`<div class="stage">${tag}
      <div class="flagbox">${flagHTML(c)}
        <div class="tiles" id="tiles">${Array.from({length:9},()=>"<i></i>").join("")}</div></div>
      <p class="qtext">${qt}</p>
      <div class="note">العلم ينكشف تدريجيًا — كلما أجبتم أبكر زادت النقاط</div>
      ${optionsHTML(list,key)}
      <div class="note" id="note"></div></div>`;
    const order=shuffle([...Array(9).keys()]);let k=0;let bonusPts=24;
    const reveal1=()=>{
      if(k>=order.length-1){stopClock();return}
      $("#tiles").children[order[k++]].classList.add("off");
      bonusPts=Math.max(0,bonusPts-3);SFX.tick();
    };
    reveal1();                       // كشف فوري لأول قطعة حتى لا تبدو الشاشة فارغة
    clock=setInterval(reveal1,700);
    return wire(b,idx,base,()=>{$("#note").textContent=`${c.n} — عاصمتها ${c.c}`},()=>bonusPts);
  }

  /* البقية */
  b.innerHTML=`<div class="stage">${tag}
    ${(type==="flagCountry"||type==="flagCapital")?flagHTML(c):head}
    <p class="qtext">${qt}</p>
    ${optionsHTML(list,key)}
    <div class="note" id="note"></div></div>`;
  wire(b,idx,base,()=>{$("#note").textContent=`${c.n} — عاصمتها ${c.c}`});
}

function speedPhase(c,list,idx,base,secs,tag,qt){
  const b=$("#board");
  b.innerHTML=`<div class="stage">${tag}
    <p class="qtext">${qt}</p>
    <div class="clock" id="ck">${AR(secs)}</div>
    ${optionsHTML(list,"n")}
    <div class="note" id="note"></div></div>`;
  let n=secs;const t0=Date.now();
  clock=setInterval(()=>{n--;
    const ck=$("#ck");if(ck){ck.textContent=AR(Math.max(0,n));ck.classList.toggle("warn",n<=3)}
    if(n<=3&&n>0)SFX.tick();
    if(n<=0){stopClock();lockAll(b,idx);$("#note").textContent=`انتهى الوقت — ${c.n} عاصمتها ${c.c}`;
      SFX.bad();setTimeout(advance,1900)}
  },1000);
  wire(b,idx,base,()=>{$("#note").textContent=`${c.n} — عاصمتها ${c.c}`},()=>{
    const el=(Date.now()-t0)/1000;
    return el<=3?20:el<=6?10:0;      // مكافأة السرعة
  });
}

function lockAll(b,idx){
  b.querySelectorAll(".opt").forEach((o,i)=>{o.disabled=true;if(i===idx)o.classList.add("good")});
}

function wire(b,idx,base,reveal,speedBonus){
  b.querySelectorAll(".opt").forEach(o=>{
    o.onclick=()=>{
      stopClock();
      const i=+o.dataset.i, ok=(i===idx);
      b.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;
        if(j===idx)x.classList.add("good"); else if(j===i)x.classList.add("bad")});
      if(ok){
        const extra=speedBonus?speedBonus():0;
        const pts=base+extra;
        S.scores[S.turn]+=pts;
        SFX.good();setTimeout(SFX.pts,180);burst(60);
        const note=$("#note");
        if(note)note.textContent=`✅ +${AR(pts)} نقطة`+(extra?` (مكافأة سرعة +${AR(extra)})`:"");
      }else{
        SFX.bad();
        if(reveal)reveal();
      }
      paintTop();
      setTimeout(advance,ok?1500:2200);
    };
  });
}

function advance(){
  S.q++;
  if(S.teams>1)S.turn=(S.turn+1)%S.teams;
  nextRound();
}

/* ---------- النهاية ---------- */
function finish(){
  stopClock();
  const rank=S.names.map((n,i)=>({n,p:S.scores[i],i})).sort((a,b)=>b.p-a.p);
  const top=rank[0];
  const tie=rank.length>1&&rank[0].p===rank[1].p;
  $("#endSub").textContent = S.teams===1
    ? `جمعت ${AR(top.p)} نقطة في رحلة حول العالم 🌍`
    : (tie?"تعادل مثير — جولة قوية من الجميع!":`الفريق الفائز: ${top.n} 🏆`);
  const pod=$("#podium");pod.innerHTML="";
  rank.forEach((r,i)=>{
    const d=document.createElement("div");d.className="pod";
    d.innerHTML=(i<3?`<img src="${MED[i]}" alt="">`:"")+
      `<span class="pn" style="color:${TEAM_COLORS[r.i%4]}">${r.n}</span>`+
      `<span class="pp">${AR(r.p)}</span>`;
    pod.appendChild(d);
  });
  show("end");SFX.win();burst(140);
  remember(S.model);
}

function show(id){document.querySelectorAll(".sc").forEach(s=>s.classList.remove("on"));$("#"+id).classList.add("on");scrollTo(0,0)}

/* ---------- التشغيل ---------- */
function begin(){
  if(!buildPool()){alert("هذه المجموعة تحتاج دولًا أكثر عند هذا المستوى — جرّبي مستوى أعلى.");return}
  S.scores=Array(S.teams).fill(0);S.turn=0;S.q=0;S.used=[];
  S.lastCountry=null;S.lastType=null;S.lastSurprise=-9;
  show("play");SFX.start();nextRound();
}
$("#start").onclick=begin;
$("#again").onclick=()=>{show("play");begin()};
$("#othermod").onclick=()=>{const r=recent();const fresh=MODELS.filter(x=>!r.includes(x.id));
  S.model=rnd(fresh.length?fresh:MODELS).id;show("play");begin()};
$("#pick").onclick=()=>{show("setup");paintSetup()};
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊";if(!muted){ensureAC();tone(660,.12)}};

buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
</body>
