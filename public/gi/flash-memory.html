<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ذاكرة البرق | وقت غراس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--sun:#FFD25A;--coral:#FF7B7B;--mint:#4FCFA6;--sky:#5AA9FF;--grape:#B57BFF;--candy:#FF9CC7;
--ink:#3C2C4E;--ink-soft:#6E5C82;--sage:#7A9E7E;--r:26px;--shadow:0 10px 0 rgba(60,44,78,.14),0 18px 34px rgba(60,44,78,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#E9F3FF;min-height:100%}
body{margin:0;min-height:100dvh;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);
 background:radial-gradient(120% 90% at 50% 0%,#E9F3FF 0%,#F1E6FF 48%,#FFE7D9 100%);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;font-weight:800}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:14px}
.screen{display:none;min-height:100dvh;padding:18px clamp(12px,3vw,40px) 28px;overflow-x:hidden}
.screen.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.seal{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#fff,#DCEBFF);box-shadow:0 6px 0 rgba(90,169,255,.35)}
.brand b{font-size:1.15rem;font-family:'Baloo Bhaijaan 2',sans-serif}
.brand span{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700}
.icon-btn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 0 rgba(60,44,78,.12)}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(60,44,78,.12)}
.hero{text-align:center;margin:6px 0 20px}
.hero .em{font-size:clamp(58px,13vw,96px);display:inline-block;animation:zap 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(60,44,78,.25))}
@keyframes zap{0%,100%{transform:scale(1) rotate(-5deg)}45%{transform:scale(1.12) rotate(6deg)}}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);margin:6px 0 4px}
.hero p{margin:0;color:var(--ink-soft);font-weight:700}
.panel{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:var(--r);padding:20px;margin:0 auto 15px;max-width:920px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 13px;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:14px 20px;border-radius:20px;background:#fff;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 rgba(60,44,78,.12);transition:.15s;text-align:center}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(60,44,78,.12)}
.chip.on{background:linear-gradient(145deg,var(--sky),#3E8FE8);color:#fff;box-shadow:0 5px 0 rgba(45,110,185,.6)}
.chip.dice{background:linear-gradient(145deg,var(--sun),#F4B740);box-shadow:0 5px 0 rgba(190,140,25,.45)}
.hint{font-size:.82rem;color:var(--ink-soft);font-weight:700;margin-top:10px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:13px}
.name-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 rgba(60,44,78,.1)}
.dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;font-size:1rem;width:100%;color:var(--ink)}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:920px;margin:20px auto 0;padding:20px;border-radius:28px;font-family:'Baloo Bhaijaan 2',sans-serif;
 font-size:clamp(1.3rem,4vw,1.7rem);color:#fff;background:linear-gradient(145deg,#7EC0FF,#4A93E8);box-shadow:0 9px 0 #3878C4,0 20px 30px rgba(56,120,196,.35)}
.start:active{transform:translateY(6px);box-shadow:0 3px 0 #3878C4}
.play-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#fff;border-radius:16px;padding:9px 16px;font-weight:800;box-shadow:0 4px 0 rgba(60,44,78,.1);font-size:.92rem}
.turn{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1rem,3.2vw,1.35rem);color:#fff;padding:10px 22px;border-radius:20px;box-shadow:0 6px 0 rgba(60,44,78,.18);margin-inline-start:auto}
.stage{max-width:1080px;margin:0 auto;background:rgba(255,255,255,.9);border-radius:32px;padding:clamp(14px,3vw,28px);box-shadow:var(--shadow);text-align:center;min-height:56dvh;display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow:hidden}
.stage>*{width:100%;min-width:0;max-width:100%}
.scene{display:grid;gap:clamp(8px,1.6vw,16px);width:100%;min-width:0}
.slot{aspect-ratio:1/1;min-width:0;border-radius:22px;display:grid;place-items:center;font-size:clamp(28px,6.5vw,58px);
 box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);animation:pop .35s cubic-bezier(.2,1.4,.4,1) backwards}
.slot.empty{background:rgba(60,44,78,.05);box-shadow:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.countdown{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(3rem,12vw,6rem);color:var(--coral)}
.bigmsg{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.6}
.qtext{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1.3rem,4.5vw,2rem);margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;width:100%;max-width:760px;margin:0 auto}
.opt{padding:16px 10px;border-radius:22px;background:#fff;font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1rem,3.6vw,1.6rem);
 word-break:break-word;min-width:0;
 box-shadow:0 6px 0 rgba(60,44,78,.14);transition:.15s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(60,44,78,.14)}
.opt.right{background:linear-gradient(145deg,#5FD9A9,#31B786);color:#fff;box-shadow:0 6px 0 #269A70}
.opt.wrong{background:#FFE1E1;color:#C34C4C;opacity:.7}
.bar{height:14px;border-radius:10px;background:rgba(60,44,78,.08);overflow:hidden;max-width:560px;margin:14px auto 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));width:100%;transition:width 1s linear}
.mbtn{padding:16px 26px;border-radius:22px;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 rgba(0,0,0,.15);margin:6px}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mbtn.go{background:linear-gradient(145deg,var(--sun),#F0B02F);color:#5A3E00}
.mbtn.ok{background:linear-gradient(145deg,#5FD9A9,#31B786);color:#fff}
.mbtn.no{background:#F1E9F6;color:var(--ink-soft)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:1080px;margin:20px auto 0}
.team{background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(60,44,78,.12);text-align:center;border:4px solid transparent;transition:.2s}
.team.active{border-color:var(--sun);transform:translateY(-4px)}
.tname{font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.pts{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:2rem;margin:2px 0 6px}
.pm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pm button{width:36px;height:32px;border-radius:12px;background:#F3EEF8;font-weight:800;font-size:.88rem;box-shadow:0 3px 0 rgba(60,44,78,.12)}
.pm .plus{background:#DFF6EC;color:#1F8A66}.pm .minus{background:#FFE6E6;color:#C34C4C}
.trophy{font-size:clamp(70px,18vw,130px);animation:zap 2.4s ease-in-out infinite}
.podium{display:grid;gap:10px;max-width:560px;margin:18px auto}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 6px 0 rgba(60,44,78,.12)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.5rem;width:38px}
.prow .pn{font-weight:800;flex:1;text-align:start}
.prow .pp{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.6rem;color:var(--sage)}
.prow.win{background:linear-gradient(145deg,#FFF3D0,#FFE3A8);box-shadow:0 6px 0 rgba(201,168,76,.45)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>

function tone(f,d=.14,t="sine",v=.15,dl=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}

 for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-20-Math.random()*120,r:6+Math.random()*8,c:cols[i%6],
  vy:2+Math.random()*3.4,vx:-1.4+Math.random()*2.8,a:Math.random()*6,va:-.15+Math.random()*.3});
 if(bits.length===n)requestAnimationFrame(fx)}
function fx(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.y<cv.height+40);
 bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;
  cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*.6);cx.restore()});
 if(bits.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height)}

 Object.entries(TIME).forEach(([k,v])=>{const b=document.createElement("button");b.className="chip";b.dataset.z=k;
  b.textContent=v.label+" · "+AR(v.n)+" جولات";b.onclick=()=>{SFX.tap();S.time=k;S.rounds=v.n;sync()};zc.appendChild(b)});
 S.model=smartPick();names();sync();
}
function sync(){
 document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
 document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
 document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.z===S.time));
}
function names(){const box=$("#teamNames");box.innerHTML="";
 const solo=["اللاعب الأول","اللاعب الثاني","اللاعب الثالث","اللاعب الرابع"];

  row.innerHTML=`<span class="dot" style="background:${TEAM_COLORS[i]}"></span>`;
  const inp=document.createElement("input");inp.value=S.teams===1?solo[i]:S.names[i];
  inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
  inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));S.names[i]=inp.value;row.appendChild(inp);box.appendChild(row)}}

/* --- بدء --- */
function start(){S.round=0;S.turn=0;S.scores=Array(S.teams).fill(0);remember(S.model);
 $("#modelBadge").textContent=MODELS.find(m=>m.id===S.model).title;
 scores();head();show("play");nextRound()}
function scores(){const s=$("#scores");s.innerHTML="";
 for(let i=0;i<S.teams;i++){const d=document.createElement("div");d.className="team"+(i===S.turn?" active":"");
  d.innerHTML=`<div class="tname"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${S.names[i]}</div>
   <div class="pts">${AR(S.scores[i])}</div>
   <div class="pm"><button class="plus" data-i="${i}" data-v="1">+١</button><button class="plus" data-i="${i}" data-v="5">+٥</button>
   <button class="plus" data-i="${i}" data-v="10">+١٠</button><button class="minus" data-i="${i}" data-v="-1">−١</button></div>`;
  s.appendChild(d)}
 s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);
  (+b.dataset.v>0?SFX.good:SFX.soft)();scores()})}
function head(){$("#countBadge").textContent="الجولة "+AR(Math.min(S.round+1,S.rounds))+" / "+AR(S.rounds);
 const t=$("#turnTag");t.textContent=S.teams===1?"دورك الآن!":"الدور: "+S.names[S.turn];
 t.style.background=`linear-gradient(145deg,${TEAM_COLORS[S.turn]},${sh(TEAM_COLORS[S.turn])})`}
function sh(hex,amt=-24){const n=parseInt(hex.slice(1),16);
 return "#"+[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,"0")).join("")}

/* --- توليد المشهد --- */
function makeScene(){
 const m=MODELS.find(x=>x.id===S.model);
 const lvl=S.round;                       // تدرّج الصعوبة
 const cells=lvl<2?6:lvl<4?9:12;
 const count=Math.min(m.icons.length,lvl<2?4:lvl<4?6:7);
 const secs=Math.max(3,7-Math.floor(lvl/2));
 const picked=shuffle(m.icons).slice(0,count);
 const absent=m.icons.filter(i=>!picked.includes(i));
 const slots=Array(cells).fill(null);
 shuffle([...Array(cells).keys()]).slice(0,count).forEach((pos,i)=>{
   slots[pos]={...picked[i],bg:rnd(PALETTE)}});
 return {slots,cells,secs,picked,absent};
}
function makeQuestion(sc){
 const kinds=["count","color","absent","place"];
 const k=rnd(sc.absent.length?kinds:kinds.slice(0,2));
 const filled=sc.slots.filter(Boolean);
 if(k==="count"){
   const target=rnd(filled);
   const correct=filled.filter(x=>x.e===target.e).length;
   const opts=shuffle([...new Set([correct,correct+1,Math.max(1,correct-1),correct+2])]).slice(0,4);
   return {q:`كم ${target.n} شاهدتم؟`,opts:opts.map(o=>AR(o)),right:AR(correct)};
 }
 if(k==="color"){
   const t=rnd(filled);
   const wrong=shuffle(PALETTE.filter(p=>p.n!==t.bg.n)).slice(0,5).map(p=>p.n);
   return {q:`ما لون خلفية ${t.n}؟`,opts:shuffle([t.bg.n,...wrong]),right:t.bg.n};
 }
 if(k==="absent"){
   const miss=rnd(sc.absent);
   const three=shuffle(filled).slice(0,5).map(x=>x.e+" "+x.n);
   return {q:"أي عنصر لم يكن موجودًا؟",opts:shuffle([miss.e+" "+miss.n,...three]),right:miss.e+" "+miss.n};
 }
 const cols=sc.cells<=6?3:sc.cells<=9?3:4;
 const idx=sc.slots.map((v,i)=>v?i:-1).filter(i=>i>=0);
 const pick=rnd(idx);
 const row=Math.floor(pick/cols), rowsN=Math.ceil(sc.cells/cols);
 const where=row===0?"الصف العلوي":row===rowsN-1?"الصف السفلي":"الصف الأوسط";
 const same=sc.slots.filter((v,i)=>v&&Math.floor(i/cols)===row);
 const others=filled.filter(x=>!same.includes(x));
 const wrong=shuffle(others).slice(0,5).map(x=>x.e+" "+x.n);
 const right=sc.slots[pick].e+" "+sc.slots[pick].n;
 return {q:`أي عنصر كان في ${where}؟`,opts:shuffle([right,...wrong.length?wrong:[]]).slice(0,4),right};
}

/* --- سير الجولة --- */
function nextRound(){
 if(S.round>=S.rounds)return finish();
 head();
 const sc=makeScene();
 const st=$("#stage");
 st.innerHTML=`<div><div class="bigmsg">استعدوا يا ${S.teams===1?"بطل":S.names[S.turn]}!</div>
   <div class="countdown" id="cd">٣</div>
   <div class="hint" style="font-size:1rem">ركّزوا جيدًا… المشهد سيظهر لثوانٍ قليلة</div></div>`;
 let n=3;SFX.tick();
 const c1=setInterval(()=>{n--;const el=$("#cd");if(!el)return clearInterval(c1);
  if(n>0){el.textContent=AR(n);SFX.tick()}else{clearInterval(c1);showScene(sc)}},800);
}
function showScene(sc){
 const cols=sc.cells<=6?3:sc.cells<=9?3:4;
 const st=$("#stage");SFX.flash();
 st.innerHTML=`<div style="width:100%">
   <div class="scene" id="sc" style="grid-template-columns:repeat(${cols},1fr)"></div>
   <div class="bar"><i id="bar"></i></div></div>`;
 const g=$("#sc");
 sc.slots.forEach((v,i)=>{const d=document.createElement("div");
  d.className="slot"+(v?"":" empty");d.style.animationDelay=(i*.04)+"s";
  if(v){d.style.background=v.bg.c;d.textContent=v.e}g.appendChild(d)});
 requestAnimationFrame(()=>{const b=$("#bar");b.style.transition=`width ${sc.secs}s linear`;b.style.width="0%"});
 let n=sc.secs;const c2=setInterval(()=>{n--;if(n<=2&&n>0)SFX.tick();if(n<=0){clearInterval(c2);askQ(sc)}},1000);
}
function askQ(sc){
 const Q=makeQuestion(sc);SFX.tap();
 const st=$("#stage");
 st.innerHTML=`<div style="width:100%"><div class="qtext">🧠 ${Q.q}</div><div class="opts" id="opts"></div>
  <div class="hint" style="margin-top:14px">اضغط الإجابة التي قالها الفريق</div></div>`;
 const box=$("#opts");
 Q.opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;
  b.onclick=()=>{
    const ok=o===Q.right;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
      if(x.textContent===Q.right)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
    if(ok){S.scores[S.turn]+=10;SFX.good();confetti(50)}else SFX.soft();
    scores();
    setTimeout(()=>{S.round++;if(S.teams>1)S.turn=(S.turn+1)%S.teams;nextRound()},1400);
  };box.appendChild(b)});
}

 order.forEach((o,r)=>{const d=document.createElement("div");d.className="prow"+(r===0?" win":"");
  d.innerHTML=`<span class="rank">${md[r]||"🏅"}</span>
   <span class="pn"><span class="dot" style="background:${TEAM_COLORS[o.i]};display:inline-block;margin-inline-end:8px"></span>${S.names[o.i]}</span>

/* --- تنقّل --- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.flash();start()};
$("#backBtn").onclick=()=>{if(confirm("إنهاء اللعبة والعودة؟"))location.reload()};
$("#homeBtn").onclick=()=>{buildSetup();show("setup")};
$("#againOther").onclick=()=>{buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();start()};
function tSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function tFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=tSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=tFS);
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
