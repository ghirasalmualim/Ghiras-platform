<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصندوق الغامض | وقت غراس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFD25A; --coral:#FF7B7B; --mint:#4FCFA6; --sky:#5AA9FF; --grape:#B57BFF; --candy:#FF9CC7;
  --cream:#FFF6E8; --ink:#3C2C4E; --ink-soft:#6E5C82; --card:#FFFFFF;
  --sage:#7A9E7E; --gold:#C9A84C;
  --r:26px; --shadow:0 10px 0 rgba(60,44,78,.14), 0 18px 34px rgba(60,44,78,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#FFE9C9;min-height:100%}
html,body{height:100%}
body{
  margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#FFE9C9 0%,#FFDCEB 45%,#DDEBFF 100%);
  background-attachment:fixed;overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;font-weight:800;letter-spacing:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:14px}
.screen{display:none;min-height:100dvh;padding:18px clamp(12px,3vw,40px) 28px}
.screen.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== شريط علوي ===== */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand .seal{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(145deg,#fff,#FFE7B8);box-shadow:0 6px 0 rgba(201,168,76,.35)}
.brand b{font-size:1.15rem;font-family:'Baloo Bhaijaan 2',sans-serif}
.brand span{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700}
.icon-btn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:20px;
  box-shadow:0 5px 0 rgba(60,44,78,.12);transition:transform .15s}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(60,44,78,.12)}

/* ===== واجهة الإعداد ===== */
.hero{text-align:center;margin:6px 0 22px}
.hero .box-emoji{font-size:clamp(58px,13vw,96px);display:inline-block;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(60,44,78,.25))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);margin:6px 0 4px}
.hero p{margin:0;color:var(--ink-soft);font-weight:700;font-size:clamp(.95rem,2.6vw,1.1rem)}
.panel{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:var(--r);padding:20px;margin:0 auto 16px;
  max-width:920px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 14px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:14px 20px;border-radius:20px;background:#fff;font-weight:800;font-size:1.05rem;
  box-shadow:0 5px 0 rgba(60,44,78,.12);transition:.15s}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(60,44,78,.12)}
.chip.on{background:linear-gradient(145deg,var(--mint),#3BB88F);color:#fff;box-shadow:0 5px 0 rgba(41,138,107,.6)}
.chip.dice{background:linear-gradient(145deg,var(--sun),#F4B740);box-shadow:0 5px 0 rgba(190,140,25,.45)}
.hint{font-size:.82rem;color:var(--ink-soft);font-weight:700;margin-top:10px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.name-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 rgba(60,44,78,.1)}
.dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;font-size:1rem;width:100%;color:var(--ink)}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:920px;margin:22px auto 0;padding:20px;border-radius:28px;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1.3rem,4vw,1.7rem);color:#fff;
  background:linear-gradient(145deg,#FF9A6B,var(--coral));box-shadow:0 9px 0 #D95A5A,0 20px 30px rgba(217,90,90,.35);transition:.15s}
.start:active{transform:translateY(6px);box-shadow:0 3px 0 #D95A5A}

/* ===== شاشة اللعب ===== */
.play-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#fff;border-radius:16px;padding:9px 16px;font-weight:800;box-shadow:0 4px 0 rgba(60,44,78,.1);font-size:.95rem}
.turn{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1.05rem,3.4vw,1.4rem);color:#fff;padding:10px 22px;border-radius:20px;
  box-shadow:0 6px 0 rgba(60,44,78,.18);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(120px,17vw,190px),1fr));gap:clamp(10px,1.8vw,18px);
  max-width:1200px;margin:0 auto}
.box{position:relative;aspect-ratio:1/1;border-radius:24px;display:grid;place-items:center;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(2rem,6vw,3.2rem);color:#fff;
  transition:transform .18s, filter .25s;overflow:hidden}
.box::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),transparent 55%)}
.box .ribbon{position:absolute;inset:0}
.box .ribbon::before,.box .ribbon::after{content:'';position:absolute;background:rgba(255,255,255,.55)}
.box .ribbon::before{inset-inline-start:50%;top:0;bottom:0;width:14%;transform:translateX(50%)}
.box .ribbon::after{inset-block-start:50%;inset-inline:0;height:14%;transform:translateY(-50%)}
.box span{position:relative;z-index:2;text-shadow:0 3px 6px rgba(0,0,0,.25)}
.box:not(.done):active{transform:scale(.94)}
.box.done{filter:grayscale(.7) brightness(1.1);opacity:.45;pointer-events:none;transform:scale(.95)}
.box.done .ribbon{display:none}

/* ===== لوحة الفرق ===== */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:1200px;margin:22px auto 0}
.team{background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(60,44,78,.12);text-align:center;position:relative;
  border:4px solid transparent;transition:.2s}
.team.active{border-color:var(--sun);transform:translateY(-4px)}
.team .tname{font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:6px}
.team .pts{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:2.1rem;line-height:1.1;margin:2px 0 6px}
.pm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pm button{width:36px;height:34px;border-radius:12px;background:#F3EEF8;font-weight:800;font-size:.9rem;box-shadow:0 3px 0 rgba(60,44,78,.12)}
.pm button:active{transform:translateY(2px);box-shadow:none}
.pm .plus{background:#DFF6EC;color:#1F8A66}
.pm .minus{background:#FFE6E6;color:#C34C4C}

/* ===== نافذة الكشف ===== */
.modal{position:fixed;inset:0;background:rgba(60,44,78,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px;z-index:50}
.modal.on{display:grid}
.reveal{background:var(--card);border-radius:32px;max-width:640px;width:100%;padding:26px 22px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.reveal .kind{display:inline-block;padding:7px 18px;border-radius:16px;font-weight:800;font-size:.9rem;margin-bottom:10px}
.reveal .kind-ico{width:clamp(70px,18vw,110px);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
.big{font-size:clamp(52px,14vw,86px);line-height:1;margin:4px 0 10px}
.reveal .q{font-size:clamp(1.15rem,4vw,1.6rem);font-weight:800;line-height:1.7;margin:0 0 14px}
.answer{background:#F6F1FB;border-radius:20px;padding:16px;font-family:'Baloo Bhaijaan 2',sans-serif;
  font-size:clamp(1.2rem,4.4vw,1.7rem);color:var(--sage);margin-bottom:14px;display:none}
.answer.on{display:block;animation:pop .35s ease}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mbtn{padding:15px 24px;border-radius:20px;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:.15s}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mbtn.ok{background:linear-gradient(145deg,#5FD9A9,#31B786);color:#fff}
.mbtn.no{background:#F1E9F6;color:var(--ink-soft)}
.mbtn.go{background:linear-gradient(145deg,var(--sun),#F0B02F);color:#5A3E00}
.timer{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:3.4rem;color:var(--coral);margin:6px 0}

/* ===== الشاشة الختامية ===== */
.trophy{font-size:clamp(70px,18vw,130px);animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 14px 20px rgba(60,44,78,.3))}
.podium{display:grid;gap:10px;max-width:560px;margin:18px auto}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 6px 0 rgba(60,44,78,.12)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.5rem;width:38px}
.prow .pn{font-weight:800;flex:1;text-align:start}
.prow .pp{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.6rem;color:var(--sage)}
.prow.win{background:linear-gradient(145deg,#FFF3D0,#FFE3A8);box-shadow:0 6px 0 rgba(201,168,76,.45)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.factbox{background:#FFF7E0;border:2px solid #F2C94C;border-radius:16px;padding:12px 14px;margin:14px auto 2px;max-width:520px;text-align:center;box-shadow:0 4px 0 #E7B93B}.factbox b{display:block;font-family:inherit;font-weight:800;color:#B9821A;font-size:.95rem;margin-bottom:4px}.factbox span{display:block;color:#5A4A22;font-size:1rem;line-height:1.7}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>
<body>
<button id="gBack" aria-label="رجوع"><span>‹</span> رجوع</button>
<div id="gAsk"><div class="gbox"><p id="gMsg">إنهاء الجولة والعودة لشاشة الإعداد؟</p>
<div class="grow"><button id="gYes">نعم، ارجع</button><button id="gNo">لا، أكمل</button></div></div></div>


<canvas id="fx"></canvas>

const TEAM_COLORS = ["#FF7B7B","#5AA9FF","#4FCFA6","#B57BFF"];
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const STORE = "ghiras_waqt_box_recent";

/* ============ محرك اللعبة ============ */
const S = {
  model:null, teams:2, names:["الفريق الأحمر","الفريق الأزرق","الفريق الأخضر","الفريق البنفسجي"],
  time:"normal", target:9, opened:0, turn:0, scores:[], deck:[], sound:true, doubleOn:[]
};
const TIME = {quick:{n:6,label:"⚡ سريع"}, normal:{n:9,label:"🎮 عادي"}, full:{n:12,label:"🏆 جولة طويلة"}};
const $ = s => document.querySelector(s);

/* ---------- الصوت (مولّد برمجيًا — بلا ملفات) ---------- */
let AC=null;
function tone(freq, dur=.14, type="sine", vol=.16, delay=0){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const SFX = {
  tap:()=>tone(560,.08,"triangle",.12),
  open:()=>{tone(420,.1,"triangle");tone(640,.12,"triangle",.14,.08);tone(880,.2,"sine",.13,.17)},
  good:()=>{tone(660,.12,"sine");tone(880,.14,"sine",.15,.1);tone(1180,.24,"sine",.13,.21)},
  soft:()=>{tone(330,.16,"sine",.1);tone(260,.2,"sine",.09,.12)},
  gift:()=>{tone(520,.1,"square",.08);tone(780,.1,"square",.08,.09);tone(1040,.22,"triangle",.12,.18)},
  tick:()=>tone(900,.05,"square",.07),
  win:()=>[0,.13,.26,.42].forEach((d,i)=>tone([523,659,784,1046][i],.35,"sine",.14,d))
};

/* ---------- كونفيتي ---------- */
const cv=$("#fx"), cx=cv.getContext("2d"); let bits=[];
function sizeCanvas(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener("resize",sizeCanvas); sizeCanvas();
function confetti(n=90){
  for(let i=0;i<n;i++) bits.push({x:Math.random()*cv.width,y:-20-Math.random()*140,
    r:6+Math.random()*8,c:BOX_COLORS[i%BOX_COLORS.length],vy:2+Math.random()*3.5,
    vx:-1.4+Math.random()*2.8,a:Math.random()*6,va:-.15+Math.random()*.3});
  if(bits.length===n) requestAnimationFrame(loopFx);
}
function loopFx(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b=>b.y<cv.height+40);
  bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;
    cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*.6);cx.restore();});
  if(bits.length) requestAnimationFrame(loopFx); else cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- بناء واجهة الإعداد ---------- */
function recent(){ try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]} }
function remember(id){
  const r = recent().filter(x=>x!==id); r.unshift(id);
  try{localStorage.setItem(STORE, JSON.stringify(r.slice(0,5)))}catch(e){}
}
function buildSetup(){
  const mc=$("#modelChips"); mc.innerHTML="";
  MODELS.forEach(m=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=AR(m.id); b.dataset.id=m.id;
    b.onclick=()=>{SFX.tap();pickModel(m.id)}; mc.appendChild(b);
  });
  const d=document.createElement("button");
  d.className="chip dice"; d.textContent="🎲 اختر لي";
  d.onclick=()=>{SFX.gift();pickModel(smartPick(),true)}; mc.appendChild(d);

  const tc=$("#teamChips"); tc.innerHTML="";
  [["1","فردي"],["2","فريقان"],["3","٣ فرق"],["4","٤ فرق"]].forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=l; b.dataset.t=v;
    b.onclick=()=>{SFX.tap();S.teams=+v;syncChips();buildNames()}; tc.appendChild(b);
  });
  const zc=$("#timeChips"); zc.innerHTML="";
  Object.entries(TIME).forEach(([k,v])=>{
    const b=document.createElement("button"); b.className="chip"; b.dataset.z=k;
    b.textContent=v.label+" · "+AR(v.n)+" صناديق";
    b.onclick=()=>{SFX.tap();S.time=k;S.target=v.n;syncChips()}; zc.appendChild(b);
  });
  pickModel(smartPick()); buildNames(); syncChips();
}
function smartPick(){
  const r=recent(), fresh=MODELS.filter(m=>!r.includes(m.id));
  const pool = fresh.length?fresh:MODELS;
  return pool[Math.floor(Math.random()*pool.length)].id;
}
function pickModel(id,random){
  S.model=id; syncChips();
  $("#modelHint").textContent = random
    ? "اخترنا لك نموذجًا لم يُشغَّل مؤخرًا 🎲 — المحتوى يبقى مفاجأة."
    : "المحتوى مخفي حتى تبدأ اللعبة — لتبقى المفاجأة.";
}
function syncChips(){
  document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
  document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
  document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.z===S.time));
}
function buildNames(){
  const box=$("#teamNames"); box.innerHTML="";
  const solo=["اللاعب الأول","اللاعب الثاني","اللاعب الثالث","اللاعب الرابع"];
  for(let i=0;i<S.teams;i++){
    const row=document.createElement("div"); row.className="name-row";
    row.innerHTML=`<span class="dot" style="background:${TEAM_COLORS[i]}"></span>`;
    const inp=document.createElement("input");
    inp.value = S.teams===1 ? solo[i] : S.names[i];
    inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
    inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));
    S.names[i]=inp.value; row.appendChild(inp); box.appendChild(row);
  }
}

/* ---------- بدء اللعب ---------- */
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){
  const m = MODELS.find(x=>x.id===S.model);
  S.deck = shuffle(m.boxes).slice(0,S.target);
  S.opened=0; S.turn=0; S.scores=Array(S.teams).fill(0); S.doubleOn=Array(S.teams).fill(false);
  remember(S.model);
  $("#modelBadge").textContent = m.title;
  renderGrid(); renderScores(); updateHead();
  show("play"); SFX.open();
}
function renderGrid(){
  const g=$("#grid"); g.innerHTML="";
  S.deck.forEach((item,i)=>{
    const b=document.createElement("button");
    b.className="box"; b.style.background=`linear-gradient(150deg,${BOX_COLORS[i%12]},${shade(BOX_COLORS[i%12])})`;
    b.style.boxShadow=`0 8px 0 ${shade(BOX_COLORS[i%12],-38)}`;
    b.innerHTML=`<div class="ribbon"></div><span>${AR(i+1)}</span>`;
    b.setAttribute("aria-label","الصندوق رقم "+AR(i+1));
    b.onclick=()=>openBox(i,b); g.appendChild(b);
  });
}
function shade(hex,amt=-22){
  const n=parseInt(hex.slice(1),16);
  const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
function renderScores(){
  const s=$("#scores"); s.innerHTML="";
  for(let i=0;i<S.teams;i++){
    const d=document.createElement("div");
    d.className="team"+(i===S.turn?" active":"");
    d.innerHTML=`<div class="tname"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${S.names[i]}${S.doubleOn[i]?" 🔥":""}</div>
      <div class="pts">${AR(S.scores[i])}</div>
      <div class="pm">
        <button class="plus" data-i="${i}" data-v="1">+١</button>
        <button class="plus" data-i="${i}" data-v="5">+٥</button>
        <button class="plus" data-i="${i}" data-v="10">+١٠</button>
        <button class="minus" data-i="${i}" data-v="-1">−١</button>
      </div>`;
    s.appendChild(d);
  }
  s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{
    S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);
    (+b.dataset.v>0?SFX.good:SFX.soft)(); renderScores();
  });
}
function updateHead(){
  $("#countBadge").textContent = AR(S.opened)+" / "+AR(S.target);
  const t=$("#turnTag");
  t.textContent = S.teams===1 ? "دورك الآن!" : "الدور: "+S.names[S.turn];
  t.style.background = `linear-gradient(145deg,${TEAM_COLORS[S.turn]},${shade(TEAM_COLORS[S.turn])})`;
}

/* ---------- فتح الصندوق ---------- */
let timerId=null;
function openBox(i,el){
  el.classList.add("done"); SFX.open();
  const item=S.deck[i], k=KIND[item.t], r=$("#reveal");
  $("#modal").classList.add("on");
  const head = `<div class="kind" style="background:${k.color}22;color:${shade(k.color,-70)}">${k.icon} ${k.label}</div>`;

  const award = (base) => {
    let val = base;
    if(S.doubleOn[S.turn]){ val=base*2; S.doubleOn[S.turn]=false; }
    S.scores[S.turn]+=val; SFX.good(); confetti(40); flash(val);
  };
  const finish = (again=false) => {
    $("#modal").classList.remove("on"); clearInterval(timerId);
    S.opened++; if(!again && S.teams>1) S.turn=(S.turn+1)%S.teams;
    renderScores(); updateHead();
    if(S.opened>=S.target) setTimeout(endGame,450);
  };

  if(item.t==="q" || item.t==="riddle"){
    r.innerHTML = head + `${KICO[item.t]?`<img class="kind-ico" src="${KICO[item.t]}" alt="">`:`<div class="big">${k.icon}</div>`}<p class="q">${item.q}</p>
      <div class="answer" id="ans">${item.a}</div>
      <div class="mbtns">
        <button class="mbtn go" id="showAns">👁️ اكشف الإجابة</button>
        <button class="mbtn ok" id="yes">✅ إجابة صحيحة +${AR(item.p)}</button>
        <button class="mbtn no" id="no">➡️ الدور التالي</button>
      </div>`;
    $("#showAns").onclick=()=>{$("#ans").classList.add("on");SFX.gift()};
    $("#yes").onclick=()=>{award(item.p);setTimeout(()=>finish(),700)};
    $("#no").onclick=()=>{SFX.soft();finish()};
  }
  else if(item.t==="challenge"){
    r.innerHTML = head + `${KICO["challenge"]?`<img class="kind-ico" src="${KICO["challenge"]}" alt="">`:`<div class="big">⚡</div>`}<p class="q">${item.q}</p>
      <div class="timer" id="cd">٥</div>
      <div class="mbtns">
        <button class="mbtn go" id="run">▶ ابدأ العد</button>
        <button class="mbtn ok" id="yes">👏 أحسنتم +${AR(item.p)}</button>
        <button class="mbtn no" id="no">➡️ الدور التالي</button>
      </div>`;
    $("#run").onclick=()=>{
      let n=5; $("#cd").textContent=AR(n); SFX.tick();
      clearInterval(timerId);
      timerId=setInterval(()=>{n--;$("#cd").textContent=n>0?AR(n):"⏰";n>0?SFX.tick():(SFX.soft(),clearInterval(timerId))},1000);
    };
    $("#yes").onclick=()=>{award(item.p);setTimeout(()=>finish(),700)};
    $("#no").onclick=()=>{SFX.soft();finish()};
  }
  else if(item.t==="points" || item.t==="star"){
    r.innerHTML = head + `${KICO[item.t]?`<img class="kind-ico" src="${KICO[item.t]}" alt="">`:`<div class="big">${k.icon}</div>`}
      <p class="q">مبروك! ربحتم ${AR(item.v)} نقاط فورية</p>${factHTML()}
      <div class="mbtns"><button class="mbtn ok" id="take">🎉 استلام النقاط</button></div>`;
    $("#take").onclick=()=>{S.scores[S.turn]+=item.v;SFX.gift();confetti(50);setTimeout(()=>finish(),600)};
  }
  else if(item.t==="double"){
    r.innerHTML = head + `${KICO["double"]?`<img class="kind-ico" src="${KICO["double"]}" alt="">`:`<div class="big">🔥</div>`}
      <p class="q">مضاعفة النقاط!<br>نقاط صندوقكم القادم ستتضاعف ×٢</p>
      <div class="mbtns"><button class="mbtn ok" id="take">🔥 فعّلها</button></div>`;
    $("#take").onclick=()=>{S.doubleOn[S.turn]=true;SFX.gift();confetti(30);finish()};
  }
  else if(item.t==="extra"){
    r.innerHTML = head + `${KICO["extra"]?`<img class="kind-ico" src="${KICO["extra"]}" alt="">`:`<div class="big">🎯</div>`}
      <p class="q">فرصة إضافية!<br>افتحوا صندوقًا آخر قبل أن ينتقل الدور</p>
      <div class="mbtns"><button class="mbtn ok" id="take">🎯 افتح صندوقًا آخر</button></div>`;
    $("#take").onclick=()=>{SFX.gift();finish(true)};
  }
  else if(item.t==="lucky"){
    const gifts=[{x:"⭐ نجمة ذهبية +١٠",v:10},{x:"💎 كنز مخفي +١٥",v:15},{x:"✨ مفاجأة سعيدة +٥",v:5},
                 {x:"🎁 هدية مفاجئة +٨",v:8},{x:"🔥 مضاعفة للصندوق القادم",v:0,d:true}];
    r.innerHTML = head + `<div class="big" id="spin">🎁</div>
      <p class="q" id="gtxt">اسحبوا بطاقة المفاجأة…</p>
      <div class="mbtns"><button class="mbtn go" id="draw">🎁 اسحب البطاقة</button></div>`;
    $("#draw").onclick=()=>{
      const g=gifts[Math.floor(Math.random()*gifts.length)];
      let c=0; const anim=setInterval(()=>{$("#spin").textContent=[..."🎁⭐💎✨🔥"][c++%5];SFX.tick()},90);
      setTimeout(()=>{
        clearInterval(anim); $("#spin").textContent=g.x.slice(0,2);
        $("#gtxt").textContent=g.x; SFX.gift(); confetti(60);
        if(g.d) S.doubleOn[S.turn]=true; else S.scores[S.turn]+=g.v;
        $("#draw").outerHTML=`<button class="mbtn ok" id="ok2">✅ تمام</button>`;
        $("#ok2").onclick=()=>finish();
      },1000);
    };
  }
}
function flash(v){
  const t=$("#turnTag"); const old=t.textContent;
  t.textContent="+"+AR(v)+" 🎉"; setTimeout(()=>t.textContent=old,900);
}

/* ---------- تنقّل وأدوات ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.gift();start()};
$("#backBtn").onclick=()=>{if(confirm("إنهاء اللعبة والعودة؟")) show("setup")};
$("#homeBtn").onclick=()=>{SFX.tap();buildSetup();show("setup")};
$("#againOther").onclick=()=>{SFX.tap();buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();SFX.gift();start()};
function toggleSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function toggleFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=toggleSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=toggleFS);
$("#modal").onclick=e=>{if(e.target.id==="modal"){/* لا يُغلق بالخطأ أثناء العرض */}};
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
