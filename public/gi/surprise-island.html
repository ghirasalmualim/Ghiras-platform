<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزيرة المفاجآت | وقت غراس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#3EC5E8;--sea2:#1E9BC4;--sand:#FFD9A0;--palm:#4FCFA6;--sun:#FFD25A;--coral:#FF7B7B;
--ink:#274056;--ink-soft:#5C7893;--sage:#7A9E7E;--r:26px;--shadow:0 10px 0 rgba(30,64,90,.14),0 18px 34px rgba(30,64,90,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#CFF3FF;min-height:100%}
body{margin:0;min-height:100dvh;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);
 background:radial-gradient(120% 90% at 50% 0%,#CFF3FF 0%,#A9E6F7 45%,#FFE9C6 100%);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;font-weight:800}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:4px solid var(--sea2);outline-offset:3px;border-radius:14px}
.screen{display:none;min-height:100dvh;padding:18px clamp(12px,3vw,40px) 28px;overflow-x:hidden}
.screen.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.seal{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#fff,#CDEFFB);box-shadow:0 6px 0 rgba(62,197,232,.4)}
.brand b{font-size:1.15rem;font-family:'Baloo Bhaijaan 2',sans-serif}
.brand span{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700}
.icon-btn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 0 rgba(30,64,90,.14)}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(30,64,90,.14)}
.hero{text-align:center;margin:6px 0 20px}
.hero .em{font-size:clamp(58px,13vw,96px);display:inline-block;animation:wave 3s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(30,64,90,.28))}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);margin:6px 0 4px}
.hero p{margin:0;color:var(--ink-soft);font-weight:700}
.panel{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:var(--r);padding:20px;margin:0 auto 15px;max-width:920px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 13px;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:14px 20px;border-radius:20px;background:#fff;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 rgba(30,64,90,.14);transition:.15s}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(30,64,90,.14)}
.chip.on{background:linear-gradient(145deg,var(--sea),var(--sea2));color:#fff;box-shadow:0 5px 0 #157A9C}
.chip.dice{background:linear-gradient(145deg,var(--sun),#F4B740);box-shadow:0 5px 0 rgba(190,140,25,.45)}
.hint{font-size:.82rem;color:var(--ink-soft);font-weight:700;margin-top:10px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:13px}
.name-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 rgba(30,64,90,.12)}
.dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;font-size:1rem;width:100%;color:var(--ink)}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:920px;margin:20px auto 0;padding:20px;border-radius:28px;font-family:'Baloo Bhaijaan 2',sans-serif;
 font-size:clamp(1.3rem,4vw,1.7rem);color:#fff;background:linear-gradient(145deg,#FFB067,#FF8A4C);box-shadow:0 9px 0 #E06B33,0 20px 30px rgba(224,107,51,.35)}
.start:active{transform:translateY(6px);box-shadow:0 3px 0 #E06B33}
.play-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#fff;border-radius:16px;padding:9px 16px;font-weight:800;box-shadow:0 4px 0 rgba(30,64,90,.12);font-size:.92rem}
.turn{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(1rem,3.2vw,1.35rem);color:#fff;padding:10px 22px;border-radius:20px;box-shadow:0 6px 0 rgba(30,64,90,.2);margin-inline-start:auto}
/* --- الخريطة --- */
.map{position:relative;max-width:900px;margin:0 auto;aspect-ratio:4/3;border-radius:32px;overflow:hidden;box-shadow:var(--shadow)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(50%,-50%);display:grid;place-items:center;gap:2px;
 width:clamp(72px,17vw,120px);transition:transform .18s}
.spot .bubble{width:clamp(52px,12vw,84px);aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
 font-size:clamp(24px,6vw,42px);background:#fff;box-shadow:0 7px 0 rgba(30,64,90,.22);animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pl-ico{width:78%;height:auto;display:block;filter:drop-shadow(0 4px 9px rgba(0,0,0,.28))}
.spot .lbl{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(.72rem,2.4vw,.95rem);color:#fff;
 background:rgba(39,64,86,.72);padding:2px 10px;border-radius:12px;white-space:nowrap}
.spot:not(.done):active{transform:translate(50%,-50%) scale(.9)}
.spot.done{opacity:.4;pointer-events:none}
.spot.done .bubble{animation:none;background:#DDE7EE}
/* --- لوحة الفرق --- */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:900px;margin:20px auto 0}
.team{background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(30,64,90,.14);text-align:center;border:4px solid transparent;transition:.2s}
.team.active{border-color:var(--sun);transform:translateY(-4px)}
.tname{font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.pts{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:2rem;margin:2px 0 6px}
.pm{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pm button{width:36px;height:32px;border-radius:12px;background:#EEF5FA;font-weight:800;font-size:.88rem;box-shadow:0 3px 0 rgba(30,64,90,.14)}
.pm .plus{background:#DFF6EC;color:#1F8A66}.pm .minus{background:#FFE6E6;color:#C34C4C}
/* --- النافذة --- */
.modal{position:fixed;inset:0;background:rgba(30,64,90,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px;z-index:50}
.modal.on{display:grid}
.reveal{background:#fff;border-radius:32px;max-width:640px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.kind{display:inline-block;padding:7px 18px;border-radius:16px;font-weight:800;font-size:.9rem;margin-bottom:10px}
.kind-ico{width:clamp(70px,18vw,110px);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
.big{font-size:clamp(52px,14vw,86px);line-height:1;margin:4px 0 10px}
.q{font-size:clamp(1.1rem,4vw,1.55rem);font-weight:800;line-height:1.7;margin:0 0 14px}
.answer{background:#EAF6FC;border-radius:20px;padding:16px;font-family:'Baloo Bhaijaan 2',sans-serif;
 font-size:clamp(1.2rem,4.4vw,1.65rem);color:var(--sage);margin-bottom:14px;display:none}
.answer.on{display:block;animation:pop .35s ease}
.timer{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:3.2rem;color:var(--coral);margin:6px 0}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mbtn{padding:15px 24px;border-radius:20px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:.15s}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mbtn.ok{background:linear-gradient(145deg,#5FD9A9,#31B786);color:#fff}
.mbtn.no{background:#EDF2F6;color:var(--ink-soft)}
.mbtn.go{background:linear-gradient(145deg,var(--sun),#F0B02F);color:#5A3E00}
.trophy{font-size:clamp(70px,18vw,130px);animation:wave 3s ease-in-out infinite}
.podium{display:grid;gap:10px;max-width:560px;margin:18px auto}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 6px 0 rgba(30,64,90,.14)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.5rem;width:38px}
.prow .pn{font-weight:800;flex:1;text-align:start}
.prow .pp{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.6rem;color:var(--sage)}
.prow.win{background:linear-gradient(145deg,#FFF3D0,#FFE3A8);box-shadow:0 6px 0 rgba(201,168,76,.45)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.factbox{background:#FFF7E0;border:2px solid #F2C94C;border-radius:16px;padding:12px 14px;margin:14px auto 2px;max-width:520px;text-align:center;box-shadow:0 4px 0 #E7B93B}.factbox b{display:block;font-family:inherit;font-weight:800;color:#B9821A;font-size:.95rem;margin-bottom:4px}.factbox span{display:block;color:#5A4A22;font-size:1rem;line-height:1.7}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>

const TEAM_COLORS=["#FF7B7B","#3EC5E8","#4FCFA6","#B57BFF"];
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const STORE="ghiras_waqt_island_recent";
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};

const S={model:null,teams:2,names:["الفريق الأحمر","الفريق الأزرق","الفريق الأخضر","الفريق البنفسجي"],
 time:"normal",target:6,opened:0,turn:0,scores:[],deck:[],sound:true,doubleOn:[]};
const TIME={quick:{n:3,label:"⚡ سريع"},normal:{n:5,label:"🎮 عادي"},full:{n:6,label:"🏆 جولة طويلة"}};

let AC=null;
function tone(f,d=.14,t="sine",v=.15,dl=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SFX={tap:()=>tone(520,.08,"triangle",.11),
 splash:()=>{tone(300,.12,"sine",.12);tone(520,.14,"triangle",.12,.08);tone(760,.2,"sine",.11,.17)},
 good:()=>{tone(660,.12,"sine");tone(880,.14,"sine",.15,.1);tone(1180,.24,"sine",.13,.21)},
 soft:()=>{tone(330,.16,"sine",.1);tone(260,.2,"sine",.09,.12)},
 gift:()=>{tone(520,.1,"square",.08);tone(780,.1,"square",.08,.09);tone(1040,.22,"triangle",.12,.18)},
 tick:()=>tone(900,.05,"square",.07),
 win:()=>[0,.13,.26,.42].forEach((d,i)=>tone([523,659,784,1046][i],.35,"sine",.14,d))};

const cv=$("#fx"),cx=cv.getContext("2d");let bits=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",sz);sz();
function confetti(n=70){const cols=["#FF7B7B","#FFD25A","#4FCFA6","#3EC5E8","#B57BFF","#FF9CC7"];
 for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-20-Math.random()*120,r:6+Math.random()*8,c:cols[i%6],
  vy:2+Math.random()*3.4,vx:-1.4+Math.random()*2.8,a:Math.random()*6,va:-.15+Math.random()*.3});
 if(bits.length===n)requestAnimationFrame(fx)}
function fx(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.y<cv.height+40);
 bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;
  cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*.6);cx.restore()});
 if(bits.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height)}

function recent(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function remember(id){const r=recent().filter(x=>x!==id);r.unshift(id);try{localStorage.setItem(STORE,JSON.stringify(r.slice(0,5)))}catch(e){}}
function smartPick(){const r=recent(),f=MODELS.filter(m=>!r.includes(m.id));return rnd(f.length?f:MODELS).id}

function buildSetup(){
 const mc=$("#modelChips");mc.innerHTML="";
 MODELS.forEach(m=>{const b=document.createElement("button");b.className="chip";b.textContent=AR(m.id);b.dataset.id=m.id;
  b.onclick=()=>{SFX.tap();S.model=m.id;$("#modelHint").textContent="المفاجآت تُوزَّع بترتيب جديد في كل مرة.";sync()};mc.appendChild(b)});
 const d=document.createElement("button");d.className="chip dice";d.textContent="🎲 اختر لي";
 d.onclick=()=>{SFX.gift();S.model=smartPick();$("#modelHint").textContent="اخترنا نموذجًا لم يُشغَّل مؤخرًا 🎲";sync()};mc.appendChild(d);
 const tc=$("#teamChips");tc.innerHTML="";
 [["1","فردي"],["2","فريقان"],["3","٣ فرق"],["4","٤ فرق"]].forEach(([v,l])=>{const b=document.createElement("button");
  b.className="chip";b.textContent=l;b.dataset.t=v;b.onclick=()=>{SFX.tap();S.teams=+v;sync();names()};tc.appendChild(b)});
 const zc=$("#timeChips");zc.innerHTML="";
 Object.entries(TIME).forEach(([k,v])=>{const b=document.createElement("button");b.className="chip";b.dataset.z=k;
  b.textContent=v.label+" · "+AR(v.n)+" أماكن";b.onclick=()=>{SFX.tap();S.time=k;S.target=v.n;sync()};zc.appendChild(b)});
 S.model=smartPick();names();sync();
}
function sync(){
 document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
 document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
 document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.z===S.time));
}
function names(){const box=$("#teamNames");box.innerHTML="";
 const solo=["اللاعب الأول","اللاعب الثاني","اللاعب الثالث","اللاعب الرابع"];
 for(let i=0;i<S.teams;i++){const row=document.createElement("div");row.className="name-row";
  row.innerHTML=`<span class="dot" style="background:${TEAM_COLORS[i]}"></span>`;
  const inp=document.createElement("input");inp.value=S.teams===1?solo[i]:S.names[i];
  inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
  inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));S.names[i]=inp.value;row.appendChild(inp);box.appendChild(row)}}

function start(){
 const m=MODELS.find(x=>x.id===S.model);
 S.deck=shuffle(m.gifts);S.opened=0;S.turn=0;
 S.scores=Array(S.teams).fill(0);S.doubleOn=Array(S.teams).fill(false);
 remember(S.model);$("#modelBadge").textContent=m.title;
 drawMap();scores();head();show("play");SFX.splash();
}
function drawMap(){
 const map=$("#map");
 map.innerHTML=`<svg viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
  <defs>
   <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FE0F5"/><stop offset="1" stop-color="#2BA9D0"/></linearGradient>
   <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE9BE"/><stop offset="1" stop-color="#F5C579"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sea)"/>
  <path d="M0 60 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v12 q-30 10 -60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0z" fill="#fff" opacity=".22"/>
  <path d="M0 240 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v14 q-30 10 -60 0 t-60 0 t-60 0 t-60 0 t-60 0 t-60 0z" fill="#fff" opacity=".18"/>
  <ellipse cx="200" cy="168" rx="168" ry="112" fill="#57C9A0" opacity=".35"/>
  <path d="M52 176 q22 -66 96 -78 q84 -14 132 34 q44 40 24 92 q-18 48 -96 54 q-92 8 -132 -30 q-32 -30 -24 -72z" fill="url(#sand)"/>
  <path d="M96 190 q28 -46 96 -50 q72 -4 108 40 q22 26 6 52 q-26 40 -108 42 q-78 2 -104 -32 q-16 -24 2 -52z" fill="#7DD9A8" opacity=".65"/>
 </svg>`;
 PLACES.forEach((p,i)=>{
  const b=document.createElement("button");
  b.className="spot";b.style.insetInlineStart=p.x+"%";b.style.top=p.y+"%";
  b.innerHTML=`<div class="bubble" style="animation-delay:${i*.25}s">${PICO[p.n]?`<img class="pl-ico" src="${PICO[p.n]}" alt="">`:p.e}</div><div class="lbl">${p.n}</div>`;
  b.setAttribute("aria-label","استكشف "+p.n);
  b.onclick=()=>explore(i,b);
  map.appendChild(b);
 });
}
function scores(){const s=$("#scores");s.innerHTML="";
 for(let i=0;i<S.teams;i++){const d=document.createElement("div");d.className="team"+(i===S.turn?" active":"");
  d.innerHTML=`<div class="tname"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${S.names[i]}${S.doubleOn[i]?" 🔥":""}</div>
   <div class="pts">${AR(S.scores[i])}</div>
   <div class="pm"><button class="plus" data-i="${i}" data-v="1">+١</button><button class="plus" data-i="${i}" data-v="5">+٥</button>
   <button class="plus" data-i="${i}" data-v="10">+١٠</button><button class="minus" data-i="${i}" data-v="-1">−١</button></div>`;
  s.appendChild(d)}
 s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);
  (+b.dataset.v>0?SFX.good:SFX.soft)();scores()})}
function head(){$("#countBadge").textContent=AR(S.opened)+" / "+AR(S.target);
 const t=$("#turnTag");t.textContent=S.teams===1?"دورك الآن!":"الدور: "+S.names[S.turn];
 t.style.background=`linear-gradient(145deg,${TEAM_COLORS[S.turn]},${sh(TEAM_COLORS[S.turn])})`}
function sh(hex,amt=-26){const n=parseInt(hex.slice(1),16);
 return "#"+[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,"0")).join("")}

let timerId=null;
function explore(i,el){
 el.classList.add("done");SFX.splash();
 const item=S.deck[i],k=KIND[item.t],r=$("#reveal");
 $("#modal").classList.add("on");
 const head0=`<div class="kind" style="background:${k.c}22;color:${sh(k.c,-80)}">${k.icon} ${k.label} · ${PLACES[i].n}</div>`;
 const award=b=>{let v=b;if(S.doubleOn[S.turn]){v=b*2;S.doubleOn[S.turn]=false}S.scores[S.turn]+=v;SFX.good();confetti(45)};
 const done=(again)=>{$("#modal").classList.remove("on");clearInterval(timerId);
  S.opened++;if(!again&&S.teams>1)S.turn=(S.turn+1)%S.teams;scores();head();
  if(S.opened>=S.target)setTimeout(finish,450)};

 if(item.t==="q"||item.t==="riddle"){
  r.innerHTML=head0+`${KICO[item.t]?`<img class="kind-ico" src="${KICO[item.t]}" alt="">`:`<div class="big">${k.icon}</div>`}<p class="q">${item.q}</p>
   <div class="answer" id="ans">${item.a}</div>
   <div class="mbtns"><button class="mbtn go" id="sa">👁️ اكشف الإجابة</button>
    <button class="mbtn ok" id="y">✅ صحيحة +${AR(item.p)}</button>
    <button class="mbtn no" id="n">➡️ الدور التالي</button></div>`;
  $("#sa").onclick=()=>{$("#ans").classList.add("on");SFX.gift()};
  $("#y").onclick=()=>{award(item.p);setTimeout(()=>done(),700)};
  $("#n").onclick=()=>{SFX.soft();done()};
 }
 else if(item.t==="challenge"){
  r.innerHTML=head0+`${KICO["challenge"]?`<img class="kind-ico" src="${KICO["challenge"]}" alt="">`:`<div class="big">⚡</div>`}<p class="q">${item.q}</p><div class="timer" id="cd">٥</div>
   <div class="mbtns"><button class="mbtn go" id="run">▶ ابدأ العد</button>
    <button class="mbtn ok" id="y">👏 أحسنتم +${AR(item.p)}</button>
    <button class="mbtn no" id="n">➡️ الدور التالي</button></div>`;
  $("#run").onclick=()=>{let n=5;$("#cd").textContent=AR(n);SFX.tick();clearInterval(timerId);
   timerId=setInterval(()=>{n--;$("#cd").textContent=n>0?AR(n):"⏰";n>0?SFX.tick():(SFX.soft(),clearInterval(timerId))},1000)};
  $("#y").onclick=()=>{award(item.p);setTimeout(()=>done(),700)};
  $("#n").onclick=()=>{SFX.soft();done()};
 }

  r.innerHTML=head0+`${KICO[item.t]?`<img class="kind-ico" src="${KICO[item.t]}" alt="">`:`<div class="big">${k.icon}</div>`}
   <p class="q">${item.t==="treasure"?"وجدتم الكنز! ":"مبروك! "}ربحتم ${AR(item.v)} نقاط</p>${factHTML()}
   <div class="mbtns"><button class="mbtn ok" id="t">🎉 استلام</button></div>`;
  $("#t").onclick=()=>{S.scores[S.turn]+=item.v;SFX.gift();confetti(55);setTimeout(()=>done(),600)};
 }
 else if(item.t==="double"){
  r.innerHTML=head0+`${KICO["double"]?`<img class="kind-ico" src="${KICO["double"]}" alt="">`:`<div class="big">🔥</div>`}<p class="q">مضاعفة النقاط!<br>نقاط مكانكم القادم ستتضاعف ×٢</p>
   <div class="mbtns"><button class="mbtn ok" id="t">🔥 فعّلها</button></div>`;
  $("#t").onclick=()=>{S.doubleOn[S.turn]=true;SFX.gift();confetti(30);done()};
 }
 else{
  r.innerHTML=head0+`${KICO["extra"]?`<img class="kind-ico" src="${KICO["extra"]}" alt="">`:`<div class="big">🎯</div>`}<p class="q">فرصة إضافية!<br>استكشفوا مكانًا آخر قبل أن ينتقل الدور</p>
   <div class="mbtns"><button class="mbtn ok" id="t">🎯 مكان آخر</button></div>`;
  $("#t").onclick=()=>{SFX.gift();done(true)};
 }
}

 order.forEach((o,r)=>{const d=document.createElement("div");d.className="prow"+(r===0?" win":"");
  d.innerHTML=`<span class="rank">${md[r]||"🏅"}</span>
   <span class="pn"><span class="dot" style="background:${TEAM_COLORS[o.i]};display:inline-block;margin-inline-end:8px"></span>${S.names[o.i]}</span>

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.splash();start()};
$("#backBtn").onclick=()=>{if(confirm("إنهاء الرحلة والعودة؟"))location.reload()};
$("#homeBtn").onclick=()=>{buildSetup();show("setup")};
$("#againOther").onclick=()=>{buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();start()};
function tSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function tFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=tSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=tFS);
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
