<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحقق | وقت غراس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#0B1014;--panel:#141C22;--line:#2A3A44;--brass:#C9A227;--teal:#4FD1C5;
--sage:#93B58A;--rose:#E86A6A;--paper:#E9F0F2;--mute:#8FA3AC;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#0B1014;min-height:100%}
body{margin:0;min-height:100dvh;font-family:'Tajawal',system-ui,sans-serif;color:var(--paper);
 background:radial-gradient(70% 50% at 50% -8%,rgba(201,162,39,.14),transparent 62%),
 radial-gradient(55% 42% at 10% 100%,rgba(79,209,197,.1),transparent 60%),var(--void);
 background-attachment:fixed;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.016) 0 2px,transparent 2px 8px)}
h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:700;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:10px}
.screen{display:none;position:relative;z-index:2;min-height:100dvh;padding:16px clamp(12px,3vw,44px) 30px;overflow-x:hidden}
.screen.active{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;margin-inline-end:auto}
.seal{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
 background:linear-gradient(150deg,#1C2830,#0D1317);border:1px solid var(--line);box-shadow:0 0 22px rgba(201,162,39,.2)}
.brand b{font-family:'Cairo',sans-serif;font-size:1.05rem;letter-spacing:1px}
.brand span{display:block;font-size:.7rem;color:var(--mute);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;background:#141C22;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:.18s}
.icon-btn:hover{border-color:var(--brass)}
.hero{text-align:center;margin:14px 0 24px}
.hero-ico{width:clamp(84px,20vw,132px);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
.eyebrow{font-family:'Cairo',sans-serif;font-size:.76rem;letter-spacing:6px;color:var(--teal);margin-bottom:10px}
.hero h1{font-size:clamp(2rem,7vw,3.5rem);margin:0;
 background:linear-gradient(100deg,var(--brass),#FFF3C9 45%,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 24px rgba(201,162,39,.3))}
.hero p{color:var(--mute);font-weight:700;margin:10px 0 0}
.panel{max-width:940px;margin:0 auto 14px;background:linear-gradient(160deg,rgba(20,28,34,.92),rgba(11,16,20,.92));
 border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{margin:0 0 13px;font-size:.92rem;letter-spacing:2px;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 20px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;transition:.18s}
.chip:hover{border-color:var(--brass)}
.chip.on{background:linear-gradient(140deg,rgba(201,162,39,.2),rgba(79,209,197,.12));border-color:var(--brass);box-shadow:0 0 20px rgba(201,162,39,.22);color:#fff}
.chip.dice{border-color:var(--teal);color:var(--teal)}
.hint{font-size:.8rem;color:var(--mute);margin-top:11px;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:13px}
.name-row{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.bar{width:5px;height:22px;border-radius:4px;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;color:var(--paper);width:100%}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:940px;margin:20px auto 0;padding:19px;border-radius:13px;font-family:'Cairo',sans-serif;
 font-size:clamp(1.2rem,3.6vw,1.5rem);letter-spacing:2px;color:#0D1317;
 background:linear-gradient(100deg,var(--brass),#F0DC9A);box-shadow:0 0 40px rgba(201,162,39,.32);transition:.18s}
.start:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(201,162,39,.5)}
.play-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#141C22;border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:800;font-size:.86rem}
.stage{max-width:1000px;margin:0 auto;background:linear-gradient(160deg,rgba(20,28,34,.94),rgba(11,16,20,.94));
 border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,32px);overflow:hidden}
.tag{display:inline-block;padding:6px 16px;border-radius:8px;font-size:.76rem;font-weight:800;letter-spacing:1px;border:1px solid var(--line);color:var(--teal);margin-bottom:10px}
.case{font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:800;line-height:2;text-align:center;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.03);transition:.18s}
.card .who{font-family:'Cairo',sans-serif;font-size:1.1rem;color:var(--brass);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card .said{font-weight:700;line-height:1.8;color:var(--paper);font-size:.95rem}
.card.pick{cursor:pointer}
.card.pick:hover{border-color:var(--teal);transform:translateY(-3px)}
.card.on{border-color:var(--brass);box-shadow:0 0 24px rgba(201,162,39,.25)}
.card.guilty{border-color:var(--rose);box-shadow:0 0 28px rgba(232,106,106,.3)}
.filebox{border:1px solid var(--brass);border-radius:14px;padding:14px 18px;margin-bottom:16px;
 background:linear-gradient(160deg,rgba(201,162,39,.10),rgba(201,162,39,.02))}
.filetop{font-family:'Cairo',sans-serif;color:var(--brass);font-size:1.05rem;margin-bottom:6px}
.filetext{margin:0;font-weight:700;line-height:1.95;font-size:clamp(.95rem,3.2vw,1.1rem);color:var(--paper)}
.ask{color:var(--teal);font-weight:800;font-size:.95rem;line-height:1.9;margin:6px 0 0}
.card .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
 background:rgba(201,162,39,.15);border:1px solid var(--line);font-size:.9rem;color:var(--brass)}
.why-line{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--sage)}
.guilty-line{color:var(--rose)}
.clues{display:grid;gap:10px;margin:14px 0}
.clue{border:1px dashed var(--line);border-radius:12px;padding:13px 16px;font-weight:700;line-height:1.8;
 display:flex;gap:10px;align-items:flex-start;animation:in .35s ease}
.clue b{color:var(--teal);flex:0 0 auto}
.locked{opacity:.5;font-style:italic}
.mbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn-ico{width:26px;height:auto;vertical-align:middle;margin-inline-end:6px;display:inline-block}
.mbtn{padding:14px 22px;border-radius:12px;font-weight:800;font-size:1rem;border:1px solid var(--line);transition:.18s}
.mbtn:hover{transform:translateY(-2px)}
.mbtn.go{border-color:var(--teal);color:var(--teal)}
.mbtn.ok{background:linear-gradient(120deg,var(--brass),#F0DC9A);color:#0D1317;border:none}
.mbtn.no{border-color:var(--mute);color:var(--mute)}
.verdict{border:1px solid var(--sage);background:rgba(147,181,138,.08);border-radius:14px;padding:16px;margin-top:14px;
 font-weight:700;line-height:2;color:#DDEBD8}
.assign{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.arow{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.03)}
.arow .who2{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;justify-content:center}
.arow select{width:100%;padding:11px;border-radius:10px;background:#0F171C;color:var(--paper);
 border:1px solid var(--line);font-family:inherit;font-weight:800;font-size:.95rem}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;max-width:1000px;margin:18px auto 0}
.team{background:linear-gradient(160deg,rgba(20,28,34,.92),rgba(11,16,20,.92));border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.tname{font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:7px}
.pts{font-family:'Cairo',sans-serif;font-size:1.85rem;margin:3px 0 7px;color:var(--brass)}
.pm{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.pm button{min-width:38px;height:30px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:.78rem}
.trophy-ico{width:clamp(90px,22vw,150px);filter:drop-shadow(0 8px 22px rgba(0,0,0,.5))}
.trophy{font-size:clamp(60px,16vw,110px);filter:drop-shadow(0 0 30px rgba(201,162,39,.45))}
.podium{max-width:560px;margin:18px auto;display:grid;gap:9px}
.prow{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.prow.win{border-color:var(--brass);background:linear-gradient(120deg,rgba(201,162,39,.14),transparent);box-shadow:0 0 26px rgba(201,162,39,.18)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-size:1.4rem;width:34px}.prow .pn{flex:1;text-align:start;font-weight:800}
.prow .pp{font-family:'Cairo',sans-serif;font-size:1.5rem;color:var(--brass)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>
<body>
<a href="/games-info" id="ghiras-back-btn" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;gap:6px;background:rgba(65,96,63,.92);color:#fff;font-family:Tajawal,'Segoe UI',sans-serif;font-weight:800;font-size:13px;line-height:1;padding:9px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)">← ألعاب ومعلومات</a>

<button id="gBack" aria-label="رجوع"><span>‹</span> رجوع</button>
<div id="gAsk"><div class="gbox"><p id="gMsg">إنهاء الجولة والعودة لشاشة الإعداد؟</p>
<div class="grow"><button id="gYes">نعم، ارجع</button><button id="gNo">لا، أكمل</button></div></div></div>

<canvas id="fx"></canvas>

<section id="setup" class="screen active">
  <div class="topbar">
    <div class="brand"><div class="seal">🌱</div><div><b>وقت غراس</b><span>ألعاب جماعية ممتعة</span></div></div>
    <button class="icon-btn" id="sndBtn">🔊</button><button class="icon-btn" id="fsBtn">⛶</button>
  </div>
  <div class="hero"><img class="hero-ico" src="" id="heroIco" alt=""><div class="eyebrow">DETECTIVE</div><h1>المحقق</h1>
    <p>أربع شهادات… وأدلة تكشف واحدًا تلو الآخر. من يصل إلى الحقيقة بأقل دليل؟</p></div>
  <div class="panel"><h3>◆ القضية</h3><div class="chips" id="modelChips"></div><div class="hint" id="modelHint">تفاصيل القضية تظهر عند فتح الملف فقط.</div></div>
  <div class="panel"><h3>◆ الفرق</h3><div class="chips" id="teamChips"></div><div class="names" id="teamNames"></div></div>
  <button class="start" id="startBtn">▶ افتح ملف القضية</button>
</section>

<section id="play" class="screen">
  <div class="play-head">
    <button class="icon-btn" id="backBtn">✕</button>
    <div class="badge" id="modelBadge">القضية</div>
    <div class="badge" id="clueBadge">الأدلة ٠ / ٤</div>
    <div class="badge" id="worthBadge" style="margin-inline-start:auto">قيمة الاتهام ٣٠٠</div>
    <button class="icon-btn" id="sndBtn2">🔊</button><button class="icon-btn" id="fsBtn2">⛶</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="scores" id="scores"></div>
</section>

<section id="end" class="screen">
  <div class="hero"><img class="trophy-ico" src="" id="endIco" alt=""><h1 id="endTitle">أُغلق الملف</h1><p id="endSub"></p></div>
  <div class="podium" id="podium"></div>
  <div class="panel" style="text-align:center">
    <div class="mbtns">
      <button class="mbtn go" id="againOther">🔄 قضية أخرى</button>
      <button class="mbtn ok" id="againRandom">🎲 قضية عشوائية</button>
      <button class="mbtn no" id="homeBtn">🏠 العودة</button>
    </div>
  </div>
</section>

<script>
/* ============================================================
   غراس المعلم — وقت غراس | المحقق
   قضايا مدرسية خفيفة بلا عنف. كل دليل يُكشف يُنقص قيمة الاتهام.
   لإضافة قضية ٦: أضف كائنًا جديدًا إلى CASES فقط.
   ============================================================ */

const CASES=[
{id:1,title:"لغز كعكة الحفل",icon:"🎂",
 brief:"اختفت قطعة الكعكة من طاولة القاعة بين الساعة ١٠:٠٠ و١٠:١٥ صباحًا. أربعة أعضاء فقط كانوا في النادي، وكلٌّ قال أين كان.",
 suspects:[
  {n:"سالم",s:"كنت في الملعب.",clear:"الكاميرا تثبت وجوده في الملعب طوال الوقت."},
  {n:"نورة",s:"كنت في القاعة أرتّب الكراسي.",clear:"كانت أمام المشرفة التي تؤكد أنها لم تقترب من الطاولة."},
  {n:"خالد",s:"كنت في المكتبة أقرأ.",clear:""},
  {n:"ريم",s:"كنت في المطبخ أجهّز الأكواب.",clear:"الطبّاخ يؤكد وجودها معه في المطبخ."}],
 clues:[
  "كاميرا الملعب تُظهر سالم يلعب من ١٠:٠٠ حتى ١٠:٣٠ دون أن يخرج.",
  "المشرفة كانت في القاعة مع نورة، وتؤكد أن نورة لم تقترب من طاولة الكعكة.",
  "الطبّاخ يؤكد أن ريم بقيت معه في المطبخ حتى انتهى الوقت.",
  "المكتبة كانت مغلقة ذلك اليوم بالكامل لأعمال صيانة."],
 guilty:2,
 why:"الأدلة الثلاثة الأولى أثبتت وجود سالم ونورة وريم في أماكن يشهد عليها غيرهم. أما خالد فقال إنه كان في المكتبة — والمكتبة كانت مغلقة تمامًا، فشهادته مستحيلة."},

{id:2,title:"مفتاح المختبر المفقود",icon:"🔑",
 brief:"اختفى مفتاح خزانة المعمل بين الساعة ١٢:٣٠ و١:٠٠ ظهرًا. أربعة من فريق العلوم كانوا في النادي ذلك اليوم.",
 suspects:[
  {n:"ريم",s:"غادرت النادي الساعة ١٢:٠٠.",clear:"سجل الخروج يثبت مغادرتها قبل وقت الاختفاء."},
  {n:"بدر",s:"كنت أنظّف طاولات المعمل.",clear:"عامل النظافة كان معه، والطاولات بعيدة عن الخزانة."},
  {n:"لطيفة",s:"كنت في تدريب كرة السلة.",clear:"شوهدت في الحافلة ١٢:٢٠ وغادرت النادي."},
  {n:"يوسف",s:"أعدت الأدوات إلى داخل الخزانة قبل أن أغادر.",clear:""}],
 clues:[
  "سجل الخروج يؤكد مغادرة ريم في ١٢:٠٠ — أي قبل وقت الاختفاء.",
  "لطيفة شوهدت في الحافلة الساعة ١٢:٢٠ وغادرت النادي.",
  "عامل النظافة كان مع بدر عند الطاولات، وهي في الجهة المقابلة للخزانة.",
  "خزانة المعمل لا تُفتح ولا تُغلق إلا بالمفتاح، ويوسف أعاد الأدوات إليها في ١٢:٤٥."],
 guilty:3,
 why:"ريم ولطيفة غادرتا قبل وقت الاختفاء، وبدر كان تحت نظر عامل النظافة بعيدًا عن الخزانة. ويوسف نفسه قال إنه فتح الخزانة ١٢:٤٥ — والخزانة لا تُفتح إلا بالمفتاح، فالمفتاح كان في يده وقت اختفائه."},

{id:3,title:"سرّ اللوحة المقلوبة",icon:"🖼️",
 brief:"في معرض الرسم، وُجدت اللوحة الفائزة معلّقة بالمقلوب عند بداية الحفل الساعة ٨:٣٠ صباحًا. أربعة من لجنة التنظيم كانوا في المكان.",
 suspects:[
  {n:"منى",s:"علّقت جميع اللوحات الساعة ٧:٠٠.",clear:"صورة ٧:٣٠ تُظهر اللوحة سليمة بعد أن انتهت منى."},
  {n:"سعد",s:"وصلت المعرض الساعة ٨:٠٠.",clear:"بقي عند البوابة يستقبل الضيوف حتى بدء الحفل."},
  {n:"هيا",s:"كنت أرتّب الكراسي في الصالة.",clear:"الصالة في ممر آخر بعيد عن جدار اللوحات."},
  {n:"طلال",s:"صوّرت اللوحات ثم أعدت تعليق لوحة سقطت.",clear:""}],
 clues:[
  "صور المعرض المأخوذة ٧:٣٠ تُظهر اللوحة معلّقة بشكل صحيح — أي أن الخطأ وقع بعد ٧:٣٠.",
  "سعد وصل ٨:٠٠ وبقي عند البوابة يستقبل الضيوف حتى ٨:٣٠ أمام الجميع.",
  "الصالة التي كانت فيها هيا تقع في ممر آخر، ولا تمرّ على جدار اللوحات.",
  "طلال أعاد تعليق اللوحة التي سقطت في تمام ٨:١٥."],

function tone(f,d=.14,t="sine",v=.14,dl=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();

const cv=$("#fx"),cx=cv.getContext("2d");let bits=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",sz);sz();
function burst(n=90){const cols=["#C9A227","#4FD1C5","#93B58A","#F0DC9A","#E86A6A"];
 for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-15-Math.random()*120,r:3+Math.random()*5,c:cols[i%5],
  vy:2.4+Math.random()*3.2,vx:-1.2+Math.random()*2.4,a:Math.random()*6,va:-.2+Math.random()*.4});
 if(bits.length===n)requestAnimationFrame(fx)}
function fx(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.y<cv.height+30);
 bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);
  cx.fillStyle=b.c;cx.shadowBlur=12;cx.shadowColor=b.c;cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*2.2);cx.restore()});
 if(bits.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height)}

function recent(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function remember(id){const r=recent().filter(x=>x!==id);r.unshift(id);try{localStorage.setItem(STORE,JSON.stringify(r.slice(0,5)))}catch(e){}}
function smartPick(){const r=recent(),f=CASES.filter(m=>!r.includes(m.id));return rnd(f.length?f:CASES).id}

function buildSetup(){
 const mc=$("#modelChips");mc.innerHTML="";
 CASES.forEach(m=>{const b=document.createElement("button");b.className="chip";b.textContent=AR(m.id);b.dataset.id=m.id;
  b.onclick=()=>{SFX.tap();S.model=m.id;$("#modelHint").textContent="تفاصيل القضية تظهر عند فتح الملف فقط.";sync()};mc.appendChild(b)});
 const d=document.createElement("button");d.className="chip dice";d.textContent="🎲 اختر لي";
 d.onclick=()=>{SFX.open();S.model=smartPick();$("#modelHint").textContent="اخترنا قضية لم تُفتح مؤخرًا 🎲";sync()};mc.appendChild(d);
 const tc=$("#teamChips");tc.innerHTML="";
 [["2","فريقان"],["3","٣ فرق"],["4","٤ فرق"]].forEach(([v,l])=>{const b=document.createElement("button");
  b.className="chip";b.textContent=l;b.dataset.t=v;b.onclick=()=>{SFX.tap();S.teams=+v;sync();names()};tc.appendChild(b)});
 S.model=smartPick();names();sync();
}
function sync(){
 document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
 document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
}
function names(){const box=$("#teamNames");box.innerHTML="";
 for(let i=0;i<S.teams;i++){const row=document.createElement("div");row.className="name-row";
  row.innerHTML=`<span class="bar" style="background:${TEAM_COLORS[i]};box-shadow:0 0 12px ${TEAM_COLORS[i]}"></span>`;
  const inp=document.createElement("input");inp.value=S.names[i];
  inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
  inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));S.names[i]=inp.value;row.appendChild(inp);box.appendChild(row)}}

function C(){return CASES.find(c=>c.id===S.model)}
function worth(){return Math.max(100,BASE-S.shown*STEP)}
function start(){
 S.shown=0;S.scores=Array(S.teams).fill(0);S.picks=Array(S.teams).fill(null);
 remember(S.model);
 $("#modelBadge").textContent=C().icon+" "+C().title;
 scores();brief();show("play");SFX.open();
}
function scores(){const s=$("#scores");s.innerHTML="";
 for(let i=0;i<S.teams;i++){const d=document.createElement("div");d.className="team";
  d.innerHTML=`<div class="tname"><span class="bar" style="width:5px;height:16px;border-radius:4px;background:${TEAM_COLORS[i]};box-shadow:0 0 10px ${TEAM_COLORS[i]}"></span>${S.names[i]}</div>
   <div class="pts">${AR(S.scores[i])}</div>
   <div class="pm"><button data-i="${i}" data-v="50">+٥٠</button><button data-i="${i}" data-v="-50">−٥٠</button></div>`;
  s.appendChild(d)}
 s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);SFX.tap();scores()})}
function head(){$("#clueBadge").textContent="الأدلة "+AR(S.shown)+" / "+AR(C().clues.length);
 $("#worthBadge").textContent="قيمة الاتهام "+AR(worth())}

function brief(){
 head();
 $("#stage").innerHTML=`
  <div style="text-align:center"><span class="tag">📁 ملف القضية</span></div>
  <p class="case">${C().brief}</p>
  <p class="ask" style="text-align:center">❓ المطلوب: من الفاعل؟ ولماذا؟</p>
  <div class="mbtns"><button class="mbtn ok" id="go">👥 استمعوا إلى الشهادات</button></div>`;
 $("#go").onclick=()=>{SFX.tap();board()};
}
function board(){
 head();
 const c=C();
 $("#stage").innerHTML=`
  <div class="filebox">
    <div class="filetop">📁 ${c.title}</div>
    <p class="filetext">${c.brief}</p>
    <p class="ask">❓ من الفاعل؟</p>
  </div>
  <div style="text-align:center"><span class="tag">🗣️ الشهادات</span></div>
  <div class="grid2" id="sus"></div>
  <div style="text-align:center"><span class="tag">🔎 الأدلة</span></div>
  <div class="clues" id="clues"></div>
  <div class="mbtns">
    ${S.shown<c.clues.length?`<button class="mbtn go" id="more"><img src="${ICO_LENS}" alt="" class="btn-ico"> اكشف دليلًا (−${AR(STEP)})</button>`:""}
    <button class="mbtn ok" id="accuse">⚖️ وقت الاتهام</button>
  </div>`;
 const sus=$("#sus");
 c.suspects.forEach((s,i)=>{const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="who"><span class="num">${AR(i+1)}</span> ${s.n}</div><div class="said">«${s.s}»</div>`;
  sus.appendChild(d)});
 const cl=$("#clues");
 c.clues.forEach((t,i)=>{const d=document.createElement("div");
  if(i<S.shown){d.className="clue";d.innerHTML=`<b>الدليل ${AR(i+1)}</b><span>${t}</span>`}
  else{d.className="clue locked";d.innerHTML=`<b>الدليل ${AR(i+1)}</b><span>— لم يُكشف بعد —</span>`}
  cl.appendChild(d)});
 if(S.shown<c.clues.length)$("#more").onclick=()=>{S.shown++;SFX.clue();board()};
 $("#accuse").onclick=()=>{SFX.tap();accuse()};
}
function accuse(){
 head();
 const c=C();
 $("#stage").innerHTML=`
  <div class="filebox"><div class="filetop">📁 ${c.title}</div><p class="filetext">${c.brief}</p></div>
  <div style="text-align:center"><span class="tag">⚖️ الاتهام</span></div>
  <p class="case">كل فريق يختار المشتبه به. الاتهام الصحيح يساوي ${AR(worth())} نقطة.</p>
  <div class="assign" id="assign"></div>
  <div class="mbtns">
    <button class="mbtn no" id="back">↩︎ عودة إلى الأدلة</button>
    <button class="mbtn ok" id="reveal">🔓 اكشف الحقيقة</button>
  </div>`;
 const a=$("#assign");
 for(let i=0;i<S.teams;i++){
  const d=document.createElement("div");d.className="arow";
  d.innerHTML=`<div class="who2"><span class="bar" style="width:5px;height:16px;border-radius:4px;background:${TEAM_COLORS[i]}"></span>${S.names[i]}</div>
   <select data-i="${i}"><option value="">— اختاروا المشتبه به —</option>
   ${c.suspects.map((s,j)=>`<option value="${j}"${S.picks[i]===j?" selected":""}>${s.n}</option>`).join("")}</select>`;
  a.appendChild(d);
 }
 a.querySelectorAll("select").forEach(sel=>sel.onchange=()=>{
  S.picks[+sel.dataset.i]=sel.value===""?null:+sel.value;SFX.tap()});
 $("#back").onclick=()=>board();
 $("#reveal").onclick=()=>verdict();
}
function verdict(){
 const c=C(),w=worth();
 let anyRight=false;
 S.picks.forEach((p,i)=>{if(p===c.guilty){S.scores[i]+=w;anyRight=true}});
 scores();
 $("#stage").innerHTML=`
  <div style="text-align:center"><span class="tag">🔓 الحقيقة</span></div>
  <div class="grid2" id="sus"></div>
  <div class="verdict"><b>الفاعل: ${c.suspects[c.guilty].n}</b><br>${c.why}</div>
  <div class="mbtns">
    ${S.picks.map((p,i)=>`<span class="mbtn ${p===c.guilty?"go":"no"}" style="cursor:default">${p===c.guilty?"✅":"❌"} ${S.names[i]}${p===c.guilty?" +"+AR(w):""}</span>`).join("")}
  </div>
  <div class="mbtns"><button class="mbtn ok" id="fin">🏁 إغلاق الملف</button></div>`;
 const sus=$("#sus");
 c.suspects.forEach((s,i)=>{const d=document.createElement("div");
  d.className="card"+(i===c.guilty?" guilty":"");
  d.innerHTML=`<div class="who">${i===c.guilty?"🚩":"✔️"} ${s.n}</div><div class="said">«${s.s}»</div>`+
   (i===c.guilty?`<div class="why-line guilty-line">هو الفاعل</div>`:`<div class="why-line">بريء — ${s.clear}</div>`);
  sus.appendChild(d)});
 anyRight?(SFX.good(),burst(110)):SFX.bad();
 $("#fin").onclick=()=>finish();
}

 order.forEach((o,r)=>{const d=document.createElement("div");d.className="prow"+(r===0&&top.p>0?" win":"");
  d.innerHTML=`<span class="rank">${md[r]||"🏅"}</span><span class="pn">${S.names[o.i]}</span><span class="pp">${AR(o.p)}</span>`;

function paintIco(){const e=document.getElementById("endIco");if(e)e.src=GAME_ICO;const s=document.getElementById("heroIco");if(s)s.src=GAME_ICO}
paintIco();
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.open();start()};
$("#backBtn").onclick=()=>{if(confirm("إغلاق الملف والعودة؟"))location.reload()};
$("#homeBtn").onclick=()=>{buildSetup();show("setup")};
$("#againOther").onclick=()=>{buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();start()};
function tSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function tFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=tSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=tFS);
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
