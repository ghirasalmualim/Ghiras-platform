<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة الهروب | وقت غراس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#0A0705;--panel:#1C1410;--line:#3A2A1E;--amber:#FFA43B;--brass:#E8C070;
--rust:#FF5C39;--steel:#7FD4E8;--paper:#F5E9DA;--mute:#A08C78;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#0A0705;min-height:100%}
body{margin:0;min-height:100dvh;font-family:'Tajawal',system-ui,sans-serif;color:var(--paper);
 background:radial-gradient(75% 55% at 50% -10%,rgba(255,164,59,.16),transparent 62%),
 radial-gradient(60% 45% at 10% 105%,rgba(255,92,57,.12),transparent 60%),var(--void);
 background-attachment:fixed;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px)}
h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:700;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:10px}
.screen{display:none;position:relative;z-index:2;min-height:100dvh;padding:16px clamp(12px,3vw,44px) 30px}
.screen.active{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;margin-inline-end:auto}
.seal{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
 background:linear-gradient(150deg,#2A1E16,#150E0A);border:1px solid var(--line);box-shadow:0 0 22px rgba(255,164,59,.2)}
.brand b{font-family:'Cairo',sans-serif;font-size:1.05rem;letter-spacing:1px}
.brand span{display:block;font-size:.7rem;color:var(--mute);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;background:#1A120C;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:.18s}
.icon-btn:hover{border-color:var(--amber)}
.hero{text-align:center;margin:14px 0 24px}
.eyebrow{font-family:'Cairo',sans-serif;font-size:.76rem;letter-spacing:6px;color:var(--rust);margin-bottom:10px}
.hero h1{font-size:clamp(2rem,7vw,3.5rem);margin:0;
 background:linear-gradient(100deg,var(--brass),#FFF0CE 45%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 26px rgba(255,164,59,.35))}
.hero p{color:var(--mute);font-weight:700;margin:10px 0 0}
.panel{max-width:940px;margin:0 auto 14px;background:linear-gradient(160deg,rgba(28,20,16,.9),rgba(10,7,5,.9));
 border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{margin:0 0 13px;font-size:.92rem;letter-spacing:2px;color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 20px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-weight:800;transition:.18s}
.chip:hover{border-color:var(--amber)}
.chip.on{background:linear-gradient(140deg,rgba(255,164,59,.2),rgba(255,92,57,.16));border-color:var(--amber);box-shadow:0 0 20px rgba(255,164,59,.25);color:#fff}
.chip.dice{border-color:var(--brass);color:var(--brass)}
.hint{font-size:.8rem;color:var(--mute);margin-top:11px;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:13px}
.name-row{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.bar{width:5px;height:22px;border-radius:4px;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;color:var(--paper);width:100%}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:940px;margin:20px auto 0;padding:19px;border-radius:13px;font-family:'Cairo',sans-serif;
 font-size:clamp(1.2rem,3.6vw,1.5rem);letter-spacing:2px;color:#1A0E05;
 background:linear-gradient(100deg,var(--amber),var(--brass));box-shadow:0 0 40px rgba(255,164,59,.35);transition:.18s}
.start:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(255,164,59,.55)}
.play-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#1A120C;border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:800;font-size:.86rem}
.turn{background:#0A0705;font-family:'Cairo',sans-serif;font-size:clamp(1rem,3vw,1.2rem);padding:9px 20px;border-radius:10px;border:1px solid;margin-inline-start:auto}
/* --- القفل --- */
.lock{max-width:960px;margin:0 auto 16px;display:flex;gap:clamp(8px,2vw,16px);justify-content:center}
.slot{width:clamp(56px,13vw,96px);aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);
 background:linear-gradient(170deg,#241A13,#120C08);display:grid;place-items:center;
 font-family:'Cairo',sans-serif;font-size:clamp(1.8rem,7vw,3rem);color:var(--line);position:relative;transition:.35s}
.slot.open{color:var(--amber);border-color:var(--amber);box-shadow:0 0 30px rgba(255,164,59,.3);
 background:linear-gradient(170deg,#3A2612,#1B1008);animation:snap .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes snap{from{transform:rotateX(80deg)}to{transform:none}}
.lock-ico{width:58%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.lock-ico.dim{opacity:.5;filter:grayscale(.6)}
.dg{display:block;font-size:.62em;margin-top:2px}
.slot.jam{color:var(--rust);border-color:rgba(255,92,57,.5);box-shadow:0 0 20px rgba(255,92,57,.18)}
.stage{max-width:960px;margin:0 auto;background:linear-gradient(160deg,rgba(28,20,16,.92),rgba(10,7,5,.92));
 border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,30px);text-align:center}
.tag{display:inline-block;padding:6px 16px;border-radius:8px;font-size:.76rem;font-weight:800;letter-spacing:1px;border:1px solid var(--line);color:var(--steel);margin-bottom:10px}
.q{font-size:clamp(1.1rem,3.7vw,1.5rem);font-weight:800;line-height:1.85;margin:14px 0}
.clock{font-family:'Cairo',sans-serif;font-size:2.2rem;color:var(--steel);margin:4px 0 12px}
.clock.low{color:var(--rust);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.14)}}
.answer{display:none;background:rgba(255,164,59,.09);border:1px solid rgba(255,164,59,.4);border-radius:12px;padding:15px;
 font-family:'Cairo',sans-serif;font-size:clamp(1.1rem,3.6vw,1.45rem);color:var(--brass);margin-bottom:14px}
.answer.on{display:block;animation:in .3s ease}
.tipbox{display:none;margin:0 auto 12px;max-width:520px;padding:10px 14px;border:1px dashed var(--steel);border-radius:10px;color:#BFE9F5;font-weight:700;font-size:.92rem}
.tipbox.on{display:block}
.mbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn-ico{width:26px;height:auto;vertical-align:middle;margin-inline-end:6px;display:inline-block}
.mbtn{padding:14px 22px;border-radius:11px;font-weight:800;border:1px solid var(--line);transition:.18s}
.mbtn:hover{transform:translateY(-2px)}
.mbtn.go{border-color:var(--steel);color:var(--steel)}
.mbtn.ok{background:linear-gradient(120deg,var(--amber),var(--brass));color:#1A0E05;border:none}
.mbtn.no{border-color:var(--rust);color:#FFB9A6}
/* --- لوحة الرمز --- */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:16px auto}
.key{padding:18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);
 font-family:'Cairo',sans-serif;font-size:1.6rem;transition:.15s}
.key:hover{border-color:var(--amber);color:var(--amber)}
.entry{font-family:'Cairo',sans-serif;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:14px;color:var(--amber);min-height:1.4em}
.door{font-size:clamp(60px,17vw,120px);filter:drop-shadow(0 0 34px rgba(255,164,59,.5))}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;max-width:960px;margin:18px auto 0}
.team{background:linear-gradient(160deg,rgba(28,20,16,.92),rgba(10,7,5,.92));border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;transition:.2s}
.team.active{border-color:var(--amber);box-shadow:0 0 24px rgba(255,164,59,.2)}
.tname{font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:7px}
.pts{font-family:'Cairo',sans-serif;font-size:1.8rem;margin:3px 0 7px;color:var(--brass)}
.pm{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.pm button{min-width:38px;height:30px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;font-size:.78rem}
.podium{max-width:560px;margin:18px auto;display:grid;gap:9px}
.prow{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.prow.win{border-color:var(--amber);background:linear-gradient(120deg,rgba(255,164,59,.13),transparent);box-shadow:0 0 28px rgba(255,164,59,.18)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-size:1.4rem;width:34px}.prow .pn{flex:1;text-align:start;font-weight:800}
.prow .pp{font-family:'Cairo',sans-serif;font-size:1.5rem;color:var(--brass)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>

const TEAM_COLORS=["#FFA43B","#7FD4E8","#FF5C39","#C4A2FF"];
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const EN=s=>s.replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
const STORE="ghiras_waqt_escape_recent";
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];

const S={model:null,teams:2,names:["الفريق الأول","الفريق الثاني","الفريق الثالث","الفريق الرابع"],
 time:"normal",step:0,turn:0,scores:[],sound:true,code:[],opened:[],entry:"",tries:0};
const TIME={quick:{sec:45,label:"⚡ سريع"},normal:{sec:90,label:"🎮 عادي"},full:{sec:150,label:"🏆 جولة طويلة"}};

let AC=null;
function tone(f,d=.14,t="sine",v=.14,dl=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SFX={tap:()=>tone(380,.07,"square",.08),
 unlock:()=>{tone(180,.14,"sawtooth",.1);tone(520,.12,"triangle",.12,.1);tone(880,.22,"sine",.12,.2)},
 fail:()=>{tone(200,.22,"sawtooth",.1);tone(140,.3,"sawtooth",.09,.16)},
 tick:()=>tone(1000,.04,"square",.05),
 open:()=>[0,.12,.24,.4,.6].forEach((d,i)=>tone([392,523,659,880,1175][i],.4,"triangle",.13,d))};

const cv=$("#fx"),cx=cv.getContext("2d");let bits=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",sz);sz();
function burst(n=90){const cols=["#FFA43B","#E8C070","#FF5C39","#7FD4E8","#FFF0CE"];
 for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-15-Math.random()*120,r:3+Math.random()*5,c:cols[i%5],
  vy:2.4+Math.random()*3.2,vx:-1.2+Math.random()*2.4,a:Math.random()*6,va:-.2+Math.random()*.4});
 if(bits.length===n)requestAnimationFrame(fx)}
function fx(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.y<cv.height+30);
 bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);
  cx.fillStyle=b.c;cx.shadowBlur=12;cx.shadowColor=b.c;cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*2.2);cx.restore()});
 if(bits.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height)}

function recent(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function remember(id){const r=recent().filter(x=>x!==id);r.unshift(id);try{localStorage.setItem(STORE,JSON.stringify(r.slice(0,5)))}catch(e){}}
function smartPick(){const r=recent(),f=ROOMS.filter(m=>!r.includes(m.id));return rnd(f.length?f:ROOMS).id}

function buildSetup(){
 const mc=$("#modelChips");mc.innerHTML="";
 ROOMS.forEach(m=>{const b=document.createElement("button");b.className="chip";b.textContent=AR(m.id);b.dataset.id=m.id;
  b.onclick=()=>{SFX.tap();S.model=m.id;$("#modelHint").textContent="اسم الغرفة يظهر عند الدخول فقط — لتبقى المفاجأة.";sync()};mc.appendChild(b)});
 const d=document.createElement("button");d.className="chip dice";d.textContent="🎲 اختر لي";
 d.onclick=()=>{SFX.unlock();S.model=smartPick();$("#modelHint").textContent="اخترنا غرفة لم تُشغَّل مؤخرًا 🎲";sync()};mc.appendChild(d);
 const tc=$("#teamChips");tc.innerHTML="";
 [["1","فردي"],["2","فريقان"],["3","٣ فرق"],["4","٤ فرق"]].forEach(([v,l])=>{const b=document.createElement("button");
  b.className="chip";b.textContent=l;b.dataset.t=v;b.onclick=()=>{SFX.tap();S.teams=+v;sync();names()};tc.appendChild(b)});
 const zc=$("#timeChips");zc.innerHTML="";
 Object.entries(TIME).forEach(([k,v])=>{const b=document.createElement("button");b.className="chip";b.dataset.z=k;
  b.textContent=v.label+" · "+AR(v.sec)+" ث لكل لغز";b.onclick=()=>{SFX.tap();S.time=k;sync()};zc.appendChild(b)});
 S.model=smartPick();names();sync();
}
function sync(){
 document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
 document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
 document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.z===S.time));
}
function names(){const box=$("#teamNames");box.innerHTML="";
 const solo=["المتسابق الأول","المتسابق الثاني","المتسابق الثالث","المتسابق الرابع"];
 for(let i=0;i<S.teams;i++){const row=document.createElement("div");row.className="name-row";
  row.innerHTML=`<span class="bar" style="background:${TEAM_COLORS[i]};box-shadow:0 0 12px ${TEAM_COLORS[i]}"></span>`;
  const inp=document.createElement("input");inp.value=S.teams===1?solo[i]:S.names[i];
  inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
  inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));S.names[i]=inp.value;row.appendChild(inp);box.appendChild(row)}}

function room(){return ROOMS.find(r=>r.id===S.model)}
function start(){
 const R=room();
 S.step=0;S.turn=0;S.scores=Array(S.teams).fill(0);S.opened=[false,false,false,false];S.skipped=[false,false,false,false];S.entry="";S.tries=0;
 S.code=R.puzzles.map(p=>p.d);remember(S.model);
 $("#modelBadge").textContent=R.icon+" "+R.title;
 lock();scores();head();show("play");puzzle();SFX.tap();
}
function lock(){
 const l=$("#lock");l.innerHTML="";
 S.code.forEach((d,i)=>{const s=document.createElement("div");
  if(S.opened[i]){s.className="slot open";s.innerHTML=`<img class="lock-ico" src="${ICO_OPEN}" alt=""><b class="dg">${d}</b>`}
  else if(S.skipped[i]){s.className="slot jam";s.textContent="✖"}
  else{s.className="slot";s.innerHTML=`<img class="lock-ico dim" src="${ICO_LOCK}" alt="">`}
  l.appendChild(s)});
}
function scores(){const s=$("#scores");s.innerHTML="";
 for(let i=0;i<S.teams;i++){const d=document.createElement("div");d.className="team"+(i===S.turn?" active":"");
  d.innerHTML=`<div class="tname"><span class="bar" style="width:5px;height:16px;border-radius:4px;background:${TEAM_COLORS[i]};box-shadow:0 0 10px ${TEAM_COLORS[i]}"></span>${S.names[i]}</div>
   <div class="pts">${AR(S.scores[i])}</div>
   <div class="pm"><button data-i="${i}" data-v="25">+٢٥</button><button data-i="${i}" data-v="50">+٥٠</button>
   <button data-i="${i}" data-v="-25">−٢٥</button></div>`;s.appendChild(d)}
 s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);SFX.tap();scores()})}
function head(){$("#countBadge").textContent=S.step<4?("اللغز "+AR(S.step+1)+" / ٤"):"الرمز النهائي";
 const t=$("#turnTag");t.textContent=S.teams===1?"دورك الآن":"الدور: "+S.names[S.turn];
 t.style.color=TEAM_COLORS[S.turn];t.style.borderColor=TEAM_COLORS[S.turn]}

/* --- اللغز --- */
let clock=null;
function puzzle(){
 if(S.step>=4)return finalCode();
 head();
 const P=room().puzzles[S.step],sec=TIME[S.time].sec;
 $("#stage").innerHTML=`
  <div class="tag">🔒 القفل رقم ${AR(S.step+1)}</div>
  <p class="q">${P.q}</p>
  <div class="clock" id="clock">${AR(sec)}</div>
  <div class="tipbox" id="tip">💡 ${P.tip}</div>
  <div class="answer" id="ans">${P.a}</div>
  <div class="mbtns">
    <button class="mbtn go" id="tipBtn">💡 تلميح (−٢٥)</button>
    <button class="mbtn go" id="showAns">👁️ اكشف الحل</button>
    <button class="mbtn ok" id="yes"><img src="${ICO_OPEN}" alt="" class="btn-ico"> حُلّ اللغز (+١٠٠)</button>
    <button class="mbtn no" id="skip">⏭️ تخطّي القفل</button>
  </div>`;
 let n=sec;clearInterval(clock);
 clock=setInterval(()=>{n--;const c=$("#clock");if(!c)return clearInterval(clock);
  c.textContent=n>0?AR(n):"⏱";c.classList.toggle("low",n<=10&&n>0);
  if(n<=5&&n>0)SFX.tick();if(n<=0){clearInterval(clock);SFX.fail()}},1000);

 $("#tipBtn").onclick=()=>{$("#tip").classList.add("on");S.scores[S.turn]=Math.max(0,S.scores[S.turn]-25);scores();SFX.tap();$("#tipBtn").disabled=true};
 $("#showAns").onclick=()=>{$("#ans").classList.add("on");clearInterval(clock);SFX.tap()};
 $("#yes").onclick=()=>{S.scores[S.turn]+=100;unlockSlot();};
 $("#skip").onclick=()=>{unlockSlot(true)};
}
function unlockSlot(skipped){
 clearInterval(clock);
 if(skipped){
   S.skipped[S.step]=true;
   S.scores[S.turn]=Math.max(0,S.scores[S.turn]-50);
   SFX.fail();
 }else{
   S.opened[S.step]=true;SFX.unlock();burst(40);
 }

}

function finalCode(){
 head();
 const missing=S.skipped.filter(Boolean).length;
 $("#stage").innerHTML=`
  <div class="tag">🚪 الباب الأخير</div>
  <p class="q">${missing
    ? "هناك "+AR(missing)+" قفلًا لم يُفتح ✖ — رقمه ما زال مجهولًا. خمّنوه، أو اشتروه بخصم من رصيدكم."

  <div class="entry" id="entry">— — — —</div>
  <div class="keypad" id="pad"></div>
  <div class="mbtns">
    <button class="mbtn no" id="clr">✖ مسح</button>
    ${missing?`<button class="mbtn go" id="buy">🔎 اكشف الأرقام المجهولة (−${AR(missing*100)})</button>`:""}
  </div>
  <div class="hint" style="margin-top:12px">أمامكم ٣ محاولات — كل محاولة خاطئة تخصم ٥٠ نقطة.</div>`;
 const pad=$("#pad");
 ["١","٢","٣","٤","٥","٦","٧","٨","٩","٠"].forEach(k=>{
   const b=document.createElement("button");b.className="key";b.textContent=k;
   b.onclick=()=>{if(S.entry.length<4){S.entry+=k;SFX.tap();paint()}};pad.appendChild(b)});
 $("#clr").onclick=()=>{S.entry="";SFX.tap();paint()};
 if(missing)$("#buy").onclick=()=>{
   S.scores[S.turn]=Math.max(0,S.scores[S.turn]-missing*100);
   S.skipped=S.skipped.map(()=>false);S.opened=[true,true,true,true];
   lock();scores();SFX.unlock();finalCode();
 };
 paint();
}
function paint(){
 const e=$("#entry");if(!e)return;
 e.textContent=(S.entry+"————").slice(0,4).split("").join(" ");
 if(S.entry.length===4){
   if(S.entry===S.code.join("")){S.scores[S.turn]+=200;scores();SFX.open();burst(150);setTimeout(()=>finish(true),700)}
   else{S.tries++;SFX.fail();S.scores[S.turn]=Math.max(0,S.scores[S.turn]-50);scores();
     e.textContent="✖ ✖ ✖ ✖";setTimeout(()=>{S.entry="";paint()},900);
     if(S.tries>=3)setTimeout(()=>finish(false),1200)}
 }
}

const md=MEDALS;
 order.forEach((o,r)=>{const d=document.createElement("div");d.className="prow"+(r===0?" win":"");
  d.innerHTML=`<span class="rank">${md[r]||"🏅"}</span><span class="pn">${S.names[o.i]}</span><span class="pp">${AR(o.p)}</span>`;

 show("end");if(escaped){burst(120);setTimeout(()=>burst(70),600)}

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.unlock();start()};
$("#backBtn").onclick=()=>{if(confirm("الخروج من الغرفة؟")){clearInterval(clock);location.reload()}};
$("#homeBtn").onclick=()=>{buildSetup();show("setup")};
$("#againOther").onclick=()=>{buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();start()};
function tSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function tFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=tSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=tFS);
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
