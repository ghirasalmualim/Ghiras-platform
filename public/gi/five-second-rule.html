<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي ٥ ثوانٍ | وقت غراس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#120415;--panel:#200A26;--line:#43164D;--hot:#FF2D78;--electric:#00E5FF;
--amber:#FFB627;--paper:#FFEAF5;--mute:#B98BC4;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background-color:#120415;min-height:100%}
body{margin:0;min-height:100dvh;font-family:'Tajawal',system-ui,sans-serif;color:var(--paper);
 background:radial-gradient(70% 50% at 50% -8%,rgba(255,45,120,.2),transparent 62%),
 radial-gradient(55% 42% at 12% 100%,rgba(0,229,255,.14),transparent 60%),var(--void);
 background-attachment:fixed;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.4;
 background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 5px)}
h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:700;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--electric);outline-offset:3px;border-radius:10px}
.screen{display:none;position:relative;z-index:2;min-height:100dvh;padding:16px clamp(12px,3vw,44px) 30px;overflow-x:hidden}
.screen.active{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;margin-inline-end:auto}
.seal{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
 background:linear-gradient(150deg,#33103B,#180620);border:1px solid var(--line);box-shadow:0 0 22px rgba(255,45,120,.25)}
.brand b{font-family:'Cairo',sans-serif;font-size:1.05rem;letter-spacing:1px}
.brand span{display:block;font-size:.7rem;color:var(--mute);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;background:#1E0824;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:.18s}
.icon-btn:hover{border-color:var(--hot)}
.hero{text-align:center;margin:14px 0 24px}
.eyebrow{font-family:'Cairo',sans-serif;font-size:.76rem;letter-spacing:6px;color:var(--electric);margin-bottom:10px}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);margin:0;
 background:linear-gradient(100deg,var(--hot),#FFD2E6 45%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 26px rgba(255,45,120,.4))}
.hero p{color:var(--mute);font-weight:700;margin:10px 0 0}
.panel{max-width:940px;margin:0 auto 14px;background:linear-gradient(160deg,rgba(32,10,38,.9),rgba(18,4,21,.9));
 border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{margin:0 0 13px;font-size:.92rem;letter-spacing:2px;color:var(--hot)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 20px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;transition:.18s}
.chip:hover{border-color:var(--hot)}
.chip.on{background:linear-gradient(140deg,rgba(255,45,120,.24),rgba(0,229,255,.14));border-color:var(--hot);box-shadow:0 0 20px rgba(255,45,120,.3);color:#fff}
.chip.dice{border-color:var(--amber);color:var(--amber)}
.hint{font-size:.8rem;color:var(--mute);margin-top:11px;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:13px}
.name-row{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.bar{width:5px;height:22px;border-radius:4px;flex:0 0 auto}
.name-row input{border:none;background:none;font-family:inherit;font-weight:800;color:var(--paper);width:100%}
.name-row input:focus{outline:none}
.start{display:block;width:100%;max-width:940px;margin:20px auto 0;padding:19px;border-radius:13px;font-family:'Cairo',sans-serif;
 font-size:clamp(1.2rem,3.6vw,1.5rem);letter-spacing:2px;color:#1B0311;
 background:linear-gradient(100deg,var(--hot),var(--amber));box-shadow:0 0 44px rgba(255,45,120,.4);transition:.18s}
.start:hover{transform:translateY(-2px);box-shadow:0 0 64px rgba(255,45,120,.6)}
.play-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.badge{background:#1E0824;border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:800;font-size:.86rem}
.turn{background:#120415;font-family:'Cairo',sans-serif;font-size:clamp(1rem,3vw,1.2rem);padding:9px 20px;border-radius:10px;border:1px solid;margin-inline-start:auto}
.stage{max-width:960px;margin:0 auto;background:linear-gradient(160deg,rgba(32,10,38,.92),rgba(18,4,21,.92));
 border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,38px);text-align:center;min-height:44dvh;
 display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow:hidden}
.stage>*{width:100%;min-width:0;max-width:100%}
.tag{display:inline-block;padding:6px 16px;border-radius:8px;font-size:.76rem;font-weight:800;letter-spacing:1px;border:1px solid var(--line);color:var(--electric);margin-bottom:6px}
.prompt{font-family:'Cairo',sans-serif;font-size:clamp(1.4rem,5.6vw,2.6rem);line-height:1.7;margin:18px 0 8px}
.dial{font-family:'Cairo',sans-serif;font-size:clamp(4.5rem,22vw,10rem);line-height:1;margin:6px 0;color:var(--electric);
 filter:drop-shadow(0 0 30px rgba(0,229,255,.45))}
.dial.hot{color:var(--hot);filter:drop-shadow(0 0 34px rgba(255,45,120,.6));animation:thump .45s infinite}
@keyframes thump{50%{transform:scale(1.16)}}
.dial.done{color:var(--amber);font-size:clamp(2.6rem,12vw,5rem)}
.streak{font-weight:800;color:var(--amber);min-height:1.4em;letter-spacing:1px}
.mbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.mbtn{padding:15px 24px;border-radius:12px;font-weight:800;font-size:1.02rem;border:1px solid var(--line);transition:.18s}
.mbtn:hover{transform:translateY(-2px)}
.mbtn.go{background:linear-gradient(120deg,var(--electric),#5CF0FF);color:#04202A;border:none}
.mbtn.ok{background:linear-gradient(120deg,var(--hot),var(--amber));color:#1B0311;border:none}
.mbtn.no{border-color:var(--mute);color:var(--mute)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;max-width:960px;margin:18px auto 0}
.team{background:linear-gradient(160deg,rgba(32,10,38,.92),rgba(18,4,21,.92));border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;transition:.2s}
.team.active{border-color:var(--hot);box-shadow:0 0 26px rgba(255,45,120,.25)}
.tname{font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:7px}
.pts{font-family:'Cairo',sans-serif;font-size:1.85rem;margin:3px 0 7px;color:var(--amber)}
.pm{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.pm button{min-width:38px;height:30px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:.78rem}
.trophy{font-size:clamp(60px,16vw,110px);filter:drop-shadow(0 0 34px rgba(255,45,120,.5))}
.podium{max-width:560px;margin:18px auto;display:grid;gap:9px}
.prow{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.prow.win{border-color:var(--hot);background:linear-gradient(120deg,rgba(255,45,120,.15),transparent);box-shadow:0 0 30px rgba(255,45,120,.2)}
.rank img{width:clamp(30px,7vw,42px);height:auto;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.rank{width:auto!important}
.prow .rank{font-size:1.4rem;width:34px}.prow .pn{flex:1;text-align:start;font-weight:800}
.prow .pp{font-family:'Cairo',sans-serif;font-size:1.5rem;color:var(--amber)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== زر الرجوع الموحّد ===== */
#gBack{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:9000;
 display:none;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:99px;cursor:pointer;
 font-family:inherit;font-weight:800;font-size:.95rem;color:#fff;background:rgba(20,26,44,.92);
 box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);
 border:1px solid rgba(255,255,255,.22);-webkit-tap-highlight-color:transparent}
#gBack.show{display:inline-flex}
#gBack:active{transform:scale(.94)}
#gAsk{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
 background:rgba(4,10,22,.72);backdrop-filter:blur(3px);padding:20px}
#gAsk.show{display:flex}
#gAsk .gbox{background:#12203A;border:1px solid rgba(255,255,255,.18);border-radius:22px;
 padding:26px 22px;max-width:400px;width:100%;text-align:center;color:#EAF2FF;
 box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:inherit}
#gAsk .gbox p{font-size:1.12rem;font-weight:800;margin:0 0 20px;line-height:1.7}
#gAsk .grow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gAsk button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
 font-weight:800;font-size:1rem}
#gYes{background:linear-gradient(180deg,#FF8A9B,#E8556E);color:#fff}
#gNo{background:linear-gradient(180deg,#7FE3B0,#2FBE7E);color:#0A2B1C}
</style>
</head>
<body>
<button id="gBack" aria-label="رجوع"><span>‹</span> رجوع</button>
<div id="gAsk"><div class="gbox"><p id="gMsg">إنهاء الجولة والعودة لشاشة الإعداد؟</p>
<div class="grow"><button id="gYes">نعم، ارجع</button><button id="gNo">لا، أكمل</button></div></div></div>

<canvas id="fx"></canvas>

<section id="setup" class="screen active">
  <div class="topbar">

</section>

<section id="play" class="screen">
  <div class="play-head">
    <button class="icon-btn" id="backBtn">✕</button>
    <div class="badge" id="modelBadge">النموذج ١</div>
    <div class="badge" id="countBadge">١ / ١٠</div>
    <div class="turn" id="turnTag">الدور: —</div>
    <button class="icon-btn" id="sndBtn2">🔊</button><button class="icon-btn" id="fsBtn2">⛶</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="scores" id="scores"></div>

function tone(f,d=.14,t="sine",v=.14,dl=0){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SFX={tap:()=>tone(440,.07,"square",.08),
 beep:()=>tone(880,.09,"square",.1),
 last:()=>tone(1200,.09,"square",.13),
 buzz:()=>{tone(200,.35,"sawtooth",.13);tone(150,.4,"sawtooth",.1,.1)},
 good:()=>{tone(660,.12,"triangle",.13);tone(990,.14,"sine",.14,.1);tone(1320,.26,"sine",.12,.22)},
 fire:()=>[0,.08,.16].forEach((d,i)=>tone([880,1180,1560][i],.2,"triangle",.13,d)),
 win:()=>[0,.14,.28,.46].forEach((d,i)=>tone([523,659,880,1175][i],.4,"triangle",.13,d))};

const cv=$("#fx"),cx=cv.getContext("2d");let bits=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",sz);sz();
function burst(n=90){const cols=["#FF2D78","#00E5FF","#FFB627","#FFD2E6","#B57BFF"];
 for(let i=0;i<n;i++)bits.push({x:Math.random()*cv.width,y:-15-Math.random()*120,r:3+Math.random()*5,c:cols[i%5],
  vy:2.4+Math.random()*3.2,vx:-1.2+Math.random()*2.4,a:Math.random()*6,va:-.2+Math.random()*.4});
 if(bits.length===n)requestAnimationFrame(fx)}
function fx(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.y<cv.height+30);
 bits.forEach(b=>{b.y+=b.vy;b.x+=b.vx;b.a+=b.va;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);
  cx.fillStyle=b.c;cx.shadowBlur=12;cx.shadowColor=b.c;cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*2.2);cx.restore()});
 if(bits.length)requestAnimationFrame(fx);else cx.clearRect(0,0,cv.width,cv.height)}

function recent(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function remember(id){const r=recent().filter(x=>x!==id);r.unshift(id);try{localStorage.setItem(STORE,JSON.stringify(r.slice(0,5)))}catch(e){}}
function smartPick(){const r=recent(),f=MODELS.filter(m=>!r.includes(m.id));return rnd(f.length?f:MODELS).id}

function buildSetup(){
 const mc=$("#modelChips");mc.innerHTML="";
 MODELS.forEach(m=>{const b=document.createElement("button");b.className="chip";b.textContent=AR(m.id);b.dataset.id=m.id;
  b.onclick=()=>{SFX.tap();S.model=m.id;$("#modelHint").textContent="التحديات تُخلط في كل جولة — لا ترتيب متوقّع.";sync()};mc.appendChild(b)});
 const d=document.createElement("button");d.className="chip dice";d.textContent="🎲 اختر لي";
 d.onclick=()=>{SFX.fire();S.model=smartPick();$("#modelHint").textContent="اخترنا نموذجًا لم يُشغَّل مؤخرًا 🎲";sync()};mc.appendChild(d);
 const tc=$("#teamChips");tc.innerHTML="";
 [["1","فردي"],["2","فريقان"],["3","٣ فرق"],["4","٤ فرق"]].forEach(([v,l])=>{const b=document.createElement("button");
  b.className="chip";b.textContent=l;b.dataset.t=v;b.onclick=()=>{SFX.tap();S.teams=+v;sync();names()};tc.appendChild(b)});
 const zc=$("#timeChips");zc.innerHTML="";
 Object.entries(TIME).forEach(([k,v])=>{const b=document.createElement("button");b.className="chip";b.dataset.z=k;
  b.textContent=v.label+" · "+AR(v.n)+" تحديات";b.onclick=()=>{SFX.tap();S.time=k;S.rounds=v.n;sync()};zc.appendChild(b)});
 S.model=smartPick();names();sync();
}
function sync(){
 document.querySelectorAll("#modelChips .chip[data-id]").forEach(b=>b.classList.toggle("on",+b.dataset.id===S.model));
 document.querySelectorAll("#teamChips .chip").forEach(b=>b.classList.toggle("on",+b.dataset.t===S.teams));
 document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("on",b.dataset.z===S.time));
}
function names(){const box=$("#teamNames");box.innerHTML="";
 const solo=["المتسابق الأول","المتسابق الثاني","المتسابق الثالث","المتسابق الرابع"];
 for(let i=0;i<S.teams;i++){const row=document.createElement("div");row.className="name-row";
  row.innerHTML=`<span class="bar" style="background:${TEAM_COLORS[i]};box-shadow:0 0 12px ${TEAM_COLORS[i]}"></span>`;
  const inp=document.createElement("input");inp.value=S.teams===1?solo[i]:S.names[i];
  inp.setAttribute("aria-label","اسم الفريق "+AR(i+1));
  inp.oninput=e=>S.names[i]=e.target.value||("فريق "+AR(i+1));S.names[i]=inp.value;row.appendChild(inp);box.appendChild(row)}}

function start(){
 const m=MODELS.find(x=>x.id===S.model);
 S.deck=shuffle(m.items);S.round=0;S.turn=0;
 S.scores=Array(S.teams).fill(0);S.streak=Array(S.teams).fill(0);
 remember(S.model);$("#modelBadge").textContent=m.title;
 scores();head();show("play");next();
}
function scores(){const s=$("#scores");s.innerHTML="";
 for(let i=0;i<S.teams;i++){const d=document.createElement("div");d.className="team"+(i===S.turn?" active":"");
  d.innerHTML=`<div class="tname"><span class="bar" style="width:5px;height:16px;border-radius:4px;background:${TEAM_COLORS[i]};box-shadow:0 0 10px ${TEAM_COLORS[i]}"></span>${S.names[i]}${S.streak[i]>=2?" 🔥":""}</div>
   <div class="pts">${AR(S.scores[i])}</div>
   <div class="pm"><button data-i="${i}" data-v="10">+١٠</button><button data-i="${i}" data-v="20">+٢٠</button>
   <button data-i="${i}" data-v="-10">−١٠</button></div>`;s.appendChild(d)}
 s.querySelectorAll(".pm button").forEach(b=>b.onclick=()=>{S.scores[+b.dataset.i]=Math.max(0,S.scores[+b.dataset.i]+ +b.dataset.v);SFX.tap();scores()})}
function head(){$("#countBadge").textContent=AR(Math.min(S.round+1,S.rounds))+" / "+AR(S.rounds);
 const t=$("#turnTag");t.textContent=S.teams===1?"دورك الآن":"الدور: "+S.names[S.turn];
 t.style.color=TEAM_COLORS[S.turn];t.style.borderColor=TEAM_COLORS[S.turn];
 t.style.boxShadow="0 0 22px "+TEAM_COLORS[S.turn]+"44"}

let clock=null;
function next(){
 if(S.round>=S.rounds)return finish();
 head();
 const text=S.deck[S.round%S.deck.length];
 const st=$("#stage");
 st.innerHTML=`
  <div><span class="tag">◆ التحدي ${AR(S.round+1)}</span></div>
  <div class="prompt">${text}</div>
  <div class="streak">${S.streak[S.turn]>=2?"🔥 سلسلة "+AR(S.streak[S.turn])+" — الإجابة القادمة بضعف النقاط":""}</div>
  <div class="mbtns"><button class="mbtn go" id="go">▶ ابدأ العد التنازلي</button></div>`;
 $("#go").onclick=()=>run(text);
}
function run(text){
 const st=$("#stage");
 st.innerHTML=`
  <div><span class="tag">◆ التحدي ${AR(S.round+1)}</span></div>
  <div class="prompt">${text}</div>
  <div class="dial" id="dial">٥</div>`;
 let n=5;SFX.beep();
 clearInterval(clock);
 clock=setInterval(()=>{
   n--;const d=$("#dial");if(!d)return clearInterval(clock);
   if(n>0){d.textContent=AR(n);d.classList.toggle("hot",n<=2);n<=2?SFX.last():SFX.beep()}
   else{clearInterval(clock);d.className="dial done";d.textContent="⏱ انتهى الوقت";SFX.buzz();judge(text)}
 },1000);
}
function judge(text){
 const dbl=S.streak[S.turn]>=2, base=dbl?20:10;
 const st=$("#stage");
 st.insertAdjacentHTML("beforeend",`
  <div class="streak">${dbl?"🔥 مضاعفة السلسلة مفعّلة":""}</div>
  <div class="mbtns">
    <button class="mbtn ok" id="y">✅ أجابوا الثلاثة +${AR(base)}</button>
    <button class="mbtn go" id="p">🤏 أجابوا جزئيًا +${AR(Math.round(base/2))}</button>
    <button class="mbtn no" id="n">❌ لم يوفّقوا</button>
  </div>`);
 const done=()=>{S.round++;if(S.teams>1)S.turn=(S.turn+1)%S.teams;scores();next()};
 $("#y").onclick=()=>{S.scores[S.turn]+=base;S.streak[S.turn]++;SFX.good();burst(dbl?90:50);scores();setTimeout(done,700)};
 $("#p").onclick=()=>{S.scores[S.turn]+=Math.round(base/2);S.streak[S.turn]=0;SFX.tap();scores();setTimeout(done,500)};
 $("#n").onclick=()=>{S.streak[S.turn]=0;SFX.buzz();scores();setTimeout(done,400)};
}
function finish(){
 clearInterval(clock);
 const order=S.scores.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p);
 const top=order[0],tie=order.filter(o=>o.p===top.p).length>1;
 $("#endTitle").textContent=S.teams===1?"انتهى التحدي":(tie?"تعادل مثير!":"🏆 "+S.names[top.i]);
 $("#endSub").textContent=S.teams===1?"رصيدك "+AR(top.p)+" نقطة تحت ضغط الوقت.":"سرعة بديهة رائعة من الجميع — والفارق كان في الثواني الأخيرة.";

const md=MEDALS;
 order.forEach((o,r)=>{const d=document.createElement("div");d.className="prow"+(r===0?" win":"");
  d.innerHTML=`<span class="rank">${md[r]||"🏅"}</span><span class="pn">${S.names[o.i]}</span><span class="pp">${AR(o.p)}</span>`;
  pod.appendChild(d)});
 show("end");SFX.win();burst(130);setTimeout(()=>burst(80),650);
}

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
$("#startBtn").onclick=()=>{SFX.fire();start()};
$("#backBtn").onclick=()=>{if(confirm("إنهاء التحدي والعودة؟")){clearInterval(clock);location.reload()}};
$("#homeBtn").onclick=()=>{buildSetup();show("setup")};
$("#againOther").onclick=()=>{buildSetup();show("setup")};
$("#againRandom").onclick=()=>{S.model=smartPick();start()};
function tSound(){S.sound=!S.sound;document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)SFX.tap()}
function tFS(){const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}
document.querySelectorAll("#sndBtn,#sndBtn2").forEach(b=>b.onclick=tSound);
document.querySelectorAll("#fsBtn,#fsBtn2").forEach(b=>b.onclick=tFS);
buildSetup();

/* ===== زر الرجوع الموحّد — يظهر في كل شاشة ونافذة عدا شاشة الإعداد ===== */
(function(){
 const B=document.getElementById("gBack"), ASK=document.getElementById("gAsk"),
       MSG=document.getElementById("gMsg");
 if(!B||!ASK)return;
 const SCREENS=()=>document.querySelectorAll(".screen,.sc");
 const ACTIVE=()=>{for(const s of SCREENS()){if(s.classList.contains("active")||s.classList.contains("on"))return s.id}return""};
 const OPENMODAL=()=>{
   for(const m of document.querySelectorAll(".modal")){
     if(m.classList.contains("on")||m.classList.contains("active")||m.classList.contains("show"))return m;
   }
   return null;
 };
 function refresh(){
   const onSetup = ACTIVE()==="setup";
   B.classList.toggle("show", !onSetup || !!OPENMODAL());
 }
 setInterval(refresh,350); refresh();

 B.onclick=()=>{
   const m=OPENMODAL();
   if(m){ m.classList.remove("on","active","show"); refresh(); return; }   // أغلق النافذة أولًا
   const a=ACTIVE();
   if(a==="end"){ back(); return; }                                        // من الختامية: رجوع مباشر
   MSG.textContent="إنهاء الجولة والعودة لشاشة الإعداد؟";
   ASK.classList.add("show");
 };
 function back(){
   ASK.classList.remove("show");
   const m=OPENMODAL(); if(m)m.classList.remove("on","active","show");
   try{ if(typeof stopClock==="function")stopClock(); }catch(e){}
   try{ if(typeof clock!=="undefined"&&clock)clearInterval(clock); }catch(e){}
   try{ if(typeof buildSetup==="function")buildSetup(); }catch(e){}
   try{ show("setup"); }catch(e){ location.reload(); }
   refresh();
 }
 document.getElementById("gYes").onclick=back;
 document.getElementById("gNo").onclick=()=>{ASK.classList.remove("show")};
 ASK.onclick=e=>{ if(e.target===ASK) ASK.classList.remove("show"); };
 /* زر الرجوع في الجهاز / لوحة المفاتيح */
 addEventListener("keydown",e=>{ if(e.key==="Escape") B.click(); });
})();
</script>
